[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dora-tools"
version = "1.1.0"
description = "DORA 工具库的代码副本与中文说明（108 件 MCP 工具，按功能域组织）"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"

# 只列「纯算法工具」需要的最小集合；感知模型见 optional-dependencies。
# 版本与上游 DORA 的测试集保持一致，便于对照。
dependencies = [
    # MCP 服务
    "mcp==1.27.0",
    "fastmcp==3.2.3",
    "pydantic==2.12.5",
    # 数值与影像
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pandas==3.0.2",
    "scikit-image==0.26.0",
    "pillow==12.2.0",
    "tifffile==2026.3.3",
    "imagecodecs==2026.3.6",   # LZW 压缩的 GeoTIFF 需要
    "matplotlib==3.10.8",
    # 矢量与栅格
    "networkx==3.6.1",
    "shapely==2.1.2",
    "geopandas==1.1.3",
    "pyogrio==0.12.1",
    "pyproj==3.7.2",
    "rasterio==1.4.4",
]

[project.optional-dependencies]
# 13 个感知模型所需；权重（12 GB）不在本仓库
perception = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "albumentations==2.0.8",
    "timm==1.0.26",
    "einops==0.8.2",
    "safetensors==0.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dora*"]

[tool.setuptools.package-data]
"dora.tools.segmentation.dinov3" = ["LICENSE"]
"dora.tools.segmentation.segformer" = ["LICENSE"]
