  code { background:#f2f4f7; padding:1px 4px; border-radius:3px; font-family:ui-monospace,Consolas,monospace; }
  pre { background:#1e2228; color:#e6edf3; padding:12px; border-radius:8px; overflow:auto; }
  pre code { background:none; color:inherit; }
  figure { margin:14px 0; }
  figure img { max-width:100%; border:1px solid var(--line); border-radius:6px; display:block; cursor:zoom-in; }
  #lb { position:fixed; inset:0; background:rgba(12,14,18,.88); display:none; z-index:99; }
  #lb.on { display:block; }
  #lb .canvas { position:absolute; inset:0; overflow:hidden; cursor:grab; }
  #lb .canvas.drag { cursor:grabbing; }
  #lb img { position:absolute; left:50%; top:50%; transform-origin:center; user-select:none; -webkit-user-drag:none; }
  #lb .tools { position:absolute; top:14px; right:16px; display:flex; gap:6px; z-index:2; }

  .dim { color:var(--dim); font-size:13px; }
  h3 { font-size:14px; margin:18px 0 6px; color:var(--mut); }

": "grid_n", "type": "int", "required": false, "default": "None", "desc": "if loop_over items are windows, provide n to compute row/col"}, {"name": "return_all", "type": "bool", "required": false, "default": "True", "desc": "return per-iteration results"}, {"name": "show_progress", "type": "bool", "required": false, "default": "True", "desc": ""}, {"name": "trajectory", "type": "list[dict]", "required": false, "default": "None", "desc": "工具调用轨迹（列表，每项含工具名与参数）"}], "returns": [{"name": "results", "type": "list, optional", "desc": "per-iteration outputs if return_all true"}], "boundary": "", "pitfall": "", "tip": "把一条链变成批处理。实测：IF 模式把每轮平均工具步数从 6.9–9.5 降到 4.6，但分数没变——瓶颈在参数绑定，而 `bind` 正是它的解法。", "keywords": "calls loop_over bind grid_n return_all show_progress trajectory", "py": "from dora.tools.analysis import tool_loop\nimport json\nres = json.loads(tool_loop(calls=\"input.tif\", loop_over=\"[]\"))", "json": "{\n  \"name\": \"tool.loop\",\n  \"arguments\": {\n    \"calls\": \"input.tif\",\n    \"loop_over\": \"[]\"\n  }\n}", "ex": {"inputs": ["同一件工具、两组参数（示意，演示批量调用）"], "in": "", "img": "", "cap": "", "note": "把「同一工具换参数跑多次」收成一次调用；返回里含每次的结果与汇总。", "status": "demo", "out": "{\n  \"tool\": \"tool.loop\",\n  \"iteration_count\": 2,\n  \"results\": []\n}"}}, {"i": 41, "name": "tool.reduce", "module": "analysis", "domain": "compute", "relevance": "★★★", "transfer": "A", "desc_cn": "找极值网格（最热/最深/最旱）", "desc_raw": "Reduce a list of dicts by a numeric field.", "plain": "从一批结果里挑出最大、最小或平均值，用来找「最严重的那个」。", "dep": "none", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "values", "type": "list[dict]", "required": true, "default": null, "desc": "待归约的数值列表"}, {"name": "field", "type": "str", "required": true, "default": null, "desc": "参与运算的字段名"}, {"name": "mode", "type": "str", "required": false, "default": "'max'", "desc": "归约方式：max / min / mean / sum"}], "returns": [{"name": "best_value", "type": "float|None", "desc": "for max/min"}, {"name": "best_index", "ty        \"latitude\": 35.691819,\n        \"longitude\": 139.6952416,\n        \"utm_x\": -12497.87625281864,\n        \"utm_y\": -34182.370152511925,\n        \"pixel_size_m\": 0.8\n      },\n      \"geometry\": {\n        \"type\": \"Point\",\n        \"coordinates\": [\n          1435.0,\n          1360.0\n        ]\n      }\n    },\n    {\n      \"type\": \"Feature\",\n      \"properties\": {\n        \"osm_id\": -28688425,\n        \"name\": \"宇奈とと\",\n        \"type\": \"restaurant\",\n        \"pixel_row\": 1342,\n        \"pixel_col\": 1562,\n        \"latitude\": 35.6918521,\n        \"longitude\": 139.695521,\n        \"utm_x\": -12472.584221742636,\n        \"utm_y\": -34178.73348329756,\n        \"pixel_size_m\": 0.8\n      },\n      \"geometry\": {\n        \"type\": \"Point\",\n        \"coordinates\": [\n          1562.0,\n          1342.0\n        ]\n      }\n    },\n    \"…（共 130 条，此处省略）\"\n  ],\n  \"output_path\": \"<temp_dir>/po"}}, {"i": 61, "name": "mask.compose_multiclass", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "把「常水体/新增水体/退水」合成一张图", "desc_raw": "Compose multiple binary masks into a single multiclass raster mask. Each input mask contributes one class value, and any positive pixel in a mask is assigned to that class in the output raster.", "plain": "把几张黑白范围图合成一张分色的图。比如把「常年有水」「新增淹没」「退水后露出的滩地」各给一种颜色，合成一张便于区分。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "mask_paths", "type": "list[str]", "required": true, "default": null, "desc": "Paths to binary mask rasters"}, {"name": "class_values", "type": "list[int]", "required": true, "default": null, "desc": "类别值到名称的映射"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to the composed multiclass raster"}, {"name": "class_values", "type": "list[int", "desc": "Class ids written into the output"}, {"name": "classes", "type": "dict", "desc": "Class label mapping for the output mask"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "mask_paths class_values", "py": "from dora.tools.analysis import mask_compose_multiclass_tool\nimport json\nres = json.loads(mask_compose_multiclass_tool(mask_paths=\"mask.png\", class_values=\"input.tif\"))", "json": "{\n  \"name\": \"mask.compose_multiclass\",\n  \"arguments\": {\n    \"mask_paths\": \"mask.png\",\n    \"class_values\": \"input.tif\"\n  }\n}", "ex": {"inputs": ["类别 2、3 各自的二值掩膜（由损毁掩膜拆出）"], "in": "", "img": "../examples/40-栅格分析/mask.compose_multiclass/out.webp", "cap": "两张二值掩膜合成一张多类掩膜", "note": "多模型各自只出二值时用它合并；类别值要预先约定好，别两处不一致。", "status": "real", "out": "{\n  \"tool\": \"mask.compose_multiclass\",\n  \"mask_path\": \"<temp_dir>/compose_multiclass_mask_c2_mask_c3_2_3_45d9ac.tif\",\n  \"class_values\": [\n    2,\n    3\n  ],\n  \"classes\": {\n    \"0\": \"background\",\n    \"2\": \"building_damage\",\n    \"3\": \"building_total_damage\"\n  }\n}"}}, {"i": 62, "name": "ras.area", "module": "calculate", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "淹没面积、受旱面积、水域面积", "desc_raw": "Calculate the area of regions in a mask. Only supports pixel-based masks.", "plain": "算某类区域有多少平方米。淹没多少亩、受旱多少平方公里，最后都落到这一个数上。", "dep": "numpy", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "mask_path", "type": "str", "required": true, "default": null, "desc": "掩膜路径（二值或多类）"}, {"name": "pixel_size_m", "type": "float", "required": true, "default": null, "desc": "像元边长（米）。掩膜无地理参考时必须显式给出"}, {"name": "classes", "type": "list[int]?", "required": false, "default": "None", "desc": "要保留的类别值列表"}], "returns": [{"name": "area_m2", "type": "float", "desc": "Total area in square meters"}, {"name": "pixel_count", "type": "int", "desc": "Number of pixels counted"}], "boundary": "", "pitfall": "", "tip": "面积 = 像元数 × 像元面积。若掩膜是 PNG（无地理参考），必须显式传 `pixel_size_m`，否则数字没有意义。", "keywords": "mask_path pixel_size_m classes", "py": "from dora.tools.calculate import ras_area\nimport json\nres = json.loads(ras_area(mask_path=\"mask.png\", pixel_size_m=\"0.0\"))", "json": "{\n  \"name\": \"ras.area\",\n  \"arguments\": {\n    \"mask_path\": \"mask.png\",\n    \"pixel_size_m\": \"0.0\"\n  }\n}", "ex": {"inputs": ["滑坡掩膜（10 m 分辨率整景）"], "in": "", "img": "", "cap": "", "note": "面积 = 像元数 × 10 m × 10 m，不含模型误差修正。", "status": "real", "out": "{\n  \"tool\": \"ras.area\",\n  \"area_m2\": 830200.0,\n  \"pixel_count\": 8302,\n  \"pixel_size_m\": 10.0\n}"}}, {"i": 63, "name": "ras.clip", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "按流域/行政区裁切", "desc_raw": "Clip a raster by a pixel window [x1:x2, y1:y2], where x is row (top→bottom) and y is column (left→right). Preserves georeferencing if the input has it (GeoTIFF/COG/etc.).", "plain": "按一块矩形范围裁图，只留下关心的那一块，后面的计算就不用管全图。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "x1", "type": "int", "required": true, "default": null, "desc": "右下角列号"}, {"name": "x2", "type": "int", "required": true, "default": null, "desc": ""}, {"name": "y1", "type": "int", "required": true, "default": null, "desc": "右下角行号"}, {"name": "y2", "type": "int", "required": true, "default": null, "desc": ""}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to clipped raster in TEMP_DIR"}, {"name": "window", "type": "dict", "desc": "{x1, x2, y1, y2} actually used"}, {"name": "out_shape", "type": "list[int,int", "desc": "[height, width]"}, {"name": "clamped", "type": "bool", "desc": "whether input window was clamped to image bounds"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path x1 x2 y1 y2", "py": "from dora.tools.analysis import ras_clip\nimport json\nres = json.loads(ras_clip(image_path=\"input.tif\", x1=\"1\", x2=\"1\", y1=\"1\", y2=\"1\"))", "json": "{\n  \"name\": \"ras.clip\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"x1\": \"1\",\n    \"x2\": \"1\",\n    \"y1\": \"1\",\n    \"y2\": \"1\"\n  }\n}", "ex": {"inputs": ["xbd guatemala_volcano_00000004 灾后影像（0.8 m，1024²，RGB）"], "in": "../examples/40-栅格分析/ras.clip/in.webp", "img": "../examples/40-栅格分析/ras.clip/out.webp", "cap": "上：输入影像；下：处理结果", "note": "", "status": "real", "out": "{\n  \"tool\": \"ras.clip\",\n  \"output_path\": \"<temp_dir>/clip_guatemala_volcano_00000004_post_6c64ba.tif\",\n  \"window\": {\n    \"x1\": 100,\n    \"x2\": 600,\n    \"y1\": 100,\n    \"y2\": 600\n  },\n  \"out_shape\": [\n    500,\n    500\n  ],\n  \"bands\": 4,\n  \"dtype\": \"uint8\",\n  \"crs\": null,\n  \"transform\": [\n    1.0,\n    0.0,\n    100.0,\n    \"…（共 9 条，此处省略）\"\n  ],\n  \"clamped\": false\n}"}}, {"i": 64, "name": "ras.concat", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "构造 14 波段输入（多光谱 + DEM + 坡度）的必经步骤", "desc_raw": "Concatenate multiple rasters along the band/channel dimension into a single GeoTIFF. All inputs must have identical height/width and, if present, the same CRS and transform.", "plain": "把几张不同来源的图按波段叠成一张多层图。有些模型要求一次吃十几个波段（可见光 + 高程 + 坡度），只能靠它拼出来。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path_list", "type": "list[str]", "required": true, "default": null, "desc": "list of raster paths (GeoTIFF/COG/…)"}, {"name": "dim", "type": "str", "required": false, "default": "'bands'", "desc": "only \"bands\" or \"channels\" is supported for now"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to the concatenated GeoTIFF in TEMP_DIR"}, {"name": "bands", "type": "int", "desc": "total bands in the output"}, {"name": "band_map", "type": "list[dict", "desc": "[{path, in_bands, out_start_band, out_end_band}]"}], "boundary": "", "pitfall": "", "tip": "构造 14 波段输入的**唯一途径**。顺序必须是 B1–B12、坡度、DEM，错序不报错但结果偏移。", "keywords": "image_path_list dim", "py": "from dora.tools.analysis import ras_concat\nimport json\nres = json.loads(ras_concat(image_path_list=\"input.tif\"))", "json": "{\n  \"name\": \"ras.concat\",\n  \"arguments\": {\n    \"image_path_list\": \"input.tif\"\n  }\n}", "ex": {"inputs": ["images/landslide4sense/Japan_all_14_sentinel.tif（12 波段）", "…_slope.tif（坡度）", "…_dem.tif（高程）"], "in": "", "img": "../examples/40-栅格分析/ras.concat/out.webp", "cap": "拼接后的 14 波段结果（预览取 B4/B3/B2）", "note": "三者的尺寸与地理参考必须完全一致；波段顺序按列表顺序落位，13、14 分别是坡度和高程。", "status": "real", "out": "{\n  \"tool\": \"ras.concat\",\n  \"output_path\": \"<temp_dir>/Japan_all_14_sentinel_concat_dde727.tif\",\n  \"height\": 1384,\n  \"width\": 1922,\n  \"bands\": 14,\n  \"dtype\": \"uint16\",\n  \"crs\": \"EPSG:4326\",\n  \"transform\": [\n    0.00012944888281104716,\n    0.0,\n    141.85923696581426,\n    \"…（共 9 条，此处省略）\"\n  ],\n  \"band_map\": [\n    {\n      \"path\": \"<DORA_DATA>/images/landslide4sense/Japan_all_14_sentinel.tif\",\n      \"in_bands\": 12,\n      \"out_start_band\": 1,\n      \"out_end_band\": 12\n    },\n    {\n      \"path\": \"<DORA_DATA>/images/landslide4sense/Japan_all_14_slope.tif\",\n      \"in_bands\": 1,\n      \"out_start_band\": 13,\n      \"out_end_band\": 13\n    },\n    {\n      \"path\": \"<DORA_DATA>/images/landslide4sense/Japan_all_14_dem.tif\",\n      \"in_bands\": 1,\n      \"out_start_band\": 14,\n      \"out_end_band\": 14\n    }\n  ],\n  \"note\": \"Concatenated along bands; inputs must share size & georeferencing.\"\n}"}}, {"i": 65, "name": "ras.count_pixels", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "面积前的中间量", "desc_raw": "Count pixels for specified classes in a mask image.", "plain": "数一数某类区域占了多少个像素。面积就是它乘上每个像素代表的平方米数。", "dep": "numpy", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "mask_path", "type": "str", "required": true, "default": null, "desc": "掩膜路径（二值或多类）"}, {"name": "classes", "type": "list[int]", "required": true, "default": null, "desc": "要保留的类别值列表"}], "returns": [{"name": "counts", "type": "dict", "desc": "Pixel counts per class"}, {"name": "total", "type": "int", "desc": "Total pixel count for all specified classes"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "mask_path classes", "py": "from dora.tools.analysis import ras_count_pixels\nimport json\nres = json.loads(ras_count_pixels(mask_path=\"mask.png\", classes=\"input.tif\"))", "json": "{\n  \"name\": \"ras.count_pixels\",\n  \"arguments\": {\n    \"mask_path\": \"mask.png\",\n    \"classes\": \"input.tif\"\n  }\n}", "ex": {"inputs": ["损毁掩膜（类别 1/2/3）"], "in": "", "img": "", "cap": "", "note": "只数像元，不做面积换算；要面积用 ras.area。", "status": "real", "out": "{\n  \"tool\": \"ras.count_pixels\",\n  \"counts\": {\n    \"2\": 25886,\n    \"3\": 2073\n  },\n  \"total\": 27959,\n  \"classes\": [\n    2,\n    3\n  ]\n}"}}, {"i": 66, "name": "ras.diff", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "多期差值、DSM−DEM 求相对高度", "desc_raw": "Subtract raster B from raster A band by band and save the difference raster. Useful for deriving relative height such as DSM - DEM.", "plain": "把两张同一位置的图逐点相减，得到变化量。两期高程相减就是填挖或淤积的厚度，两期影像相减就是地表变没变。它只会减，不会除。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_a_path", "type": "str", "required": true, "default": null, "desc": "栅格 A 路径"}, {"name": "image_b_path", "type": "str", "required": true, "default": null, "desc": "栅格 B 路径"}, {"name": "band_a", "type": "int", "required": false, "default": "1", "desc": "A 使用的波段号"}, {"name": "band_b", "type": "int", "required": false, "default": "1", "desc": "B 使用的波段号"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to the difference raster in TEMP_DIR"}, {"name": "min", "type": "float|None", "desc": "Minimum valid difference"}, {"name": "max", "type": "float|None", "desc": "Maximum valid difference"}, {"name": "mean", "type": "float|None", "desc": "Mean valid difference"}, {"name": "valid_pixels", "type": "int", "desc": "Number of valid pixels used"}], "boundary": "", "pitfall": "", "tip": "只做 A − B 的逐像元相减，**不能除**——所以算不了任何指数。DSM − DEM 求相对高度也用它。", "keywords": "image_a_path image_b_path band_a band_b", "py": "from dora.tools.analysis import ras_diff\nimport json\nres = json.loads(ras_diff(image_a_path=\"input.tif\", image_b_path=\"input.tif\"))", "json": "{\n  \"name\": \"ras.diff\",\n  \"arguments\": {\n    \"image_a_path\": \"input.tif\",\n    \"image_b_path\": \"input.tif\"\n  }\n}", "ex": {"inputs": ["images/landslide4sense/Japan_all_14_sentinel.tif（12 波段，EPSG:4326）"], "in": "", "img": "../examples/40-栅格分析/ras.diff/out.webp", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"ras.diff\",\n  \"image_a_path\": \"<DORA_DATA>/images/landslide4sense/Japan_all_14_sentinel.tif\",\n  \"image_b_path\": \"<DORA_DATA>/images/landslide4sense/Japan_all_14_sentinel.tif\",\n  \"output_path\": \"<temp_dir>/Japan_all_14_sentinel_minus_Japan_all_1_b77f31.tif\",\n  \"band_a\": 1,\n  \"band_b\": 1,\n  \"nodata\": -9999.0,\n  \"min\": 0.0,\n  \"max\": 0.0,\n  \"mean\": 0.0,\n  \"valid_pixels\": 2655360\n}"}}, {"i": 67, "name": "ras.focal_stats", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "热点检测、平滑、DEM 局部粗糙度", "desc_raw": "Compute focal (moving-window) statistics over a raster. For each pixel, aggregate the values inside a square window of side `window_size` centred on the pixel (odd window sizes recommended). Typical uses: smooth a damage density map, detect local hotspots, extract local roughness from a DEM, or pre-", "plain": "对每个像素看它周围一圈邻居，算平均、最大或波动有多大。用来平滑噪点，或找出「比周围明显异常」的点。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "raster_path", "type": "str", "required": true, "default": null, "desc": "栅格路径"}, {"name": "statistic", "type": "str", "required": false, "default": "'mean'", "desc": "统计量：mean / max / min / std / median"}, {"name": "window_size", "type": "int", "required": false, "default": "5", "desc": "邻域窗口边长（像元）"}, {"name": "nodata", "type": "float?", "required": false, "default": "None", "desc": "Value to treat as nodata. Defaults to the"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [], "boundary": "", "pitfall": "", "tip": "", "keywords": "raster_path statistic window_size nodata out_path", "py": "from dora.tools.analysis import ras_focal_stats\nimport json\nres = json.loads(ras_focal_stats(raster_path=\"input.tif\"))", "json": "{\n  \"name\": \"ras.focal_stats\",\n  \"arguments\": {\n    \"raster_path\": \"input.tif\"\n  }\n}", "ex": {"inputs": ["images/landslide4sense/Japan_all_14_sentinel.tif（12 波段，EPSG:4326）"], "in": "", "img": "../examples/40-栅格分析/ras.focal_stats/out.webp", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"ras.focal_stats\",\n  \"output_path\": \"<temp_dir>/Japan_all_14_sentinel_focal_mean_5.tif\",\n  \"statistic\": \"mean\",\n  \"window_size\": 5,\n  \"shape\": [\n    1384,\n    1922\n  ]\n}"}}, {"i": 68, "name": "ras.grid_windows", "module": "calculate", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "面雨量/旱情分区统计的基础", "desc_raw": "Split a raster image into a uniform n×n grid and return pixel windows. Indexing uses image[x1:x2, y1:y2] where x is row (top→bottom), y is column (left→right). If H or W is not divisible by n, the last row/col expands to the image boundary.", "plain": "把一张图切成 n×n 的小格，方便一格一格统计。找「最热的街区」「最旱的片区」，就是先切格再排序。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "n", "type": "int", "required": true, "default": null, "desc": "数量或网格边长"}], "returns": [{"name": "windows", "type": "list[list[int", "desc": "[[x1,x2,y1,y2], ...] in row-major order"}, {"name": "image_shape", "type": "list[int", "desc": "[height, width]"}, {"name": "base_tile_px", "type": "list[int", "desc": "[floor(H/n), floor(W/n)]"}, {"name": "count", "type": "int", "desc": "n*n"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path n", "py": "from dora.tools.calculate import ras_grid_windows\nimport json\nres = json.loads(ras_grid_windows(image_path=\"input.tif\", n=\"1\"))", "json": "{\n  \"name\": \"ras.grid_windows\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"n\": \"1\"\n  }\n}", "ex": {"inputs": ["images/landslide4sense/Japan_all_14_sentinel.tif（12 波段，EPSG:4326）"], "in": "../examples/40-栅格分析/ras.grid_windows/in.webp", "img": "", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"ras.grid_windows\",\n  \"windows\": [\n    [\n      0,\n      346,\n      0,\n      \"…（共 4 条，此处省略）\"\n    ],\n    [\n      0,\n      346,\n      480,\n      \"…（共 4 条，此处省略）\"\n    ],\n    [\n      0,\n      346,\n      960,\n      \"…（共 4 条，此处省略）\"\n    ],\n    \"…（共 16 条，此处省略）\"\n  ],\n  \"image_shape\": [\n    1384,\n    1922\n  ],\n  \"base_tile_px\": [\n    346,\n    480\n  ],\n  \"count\": 16,\n  \"note\": \"Row-major; last row/col expanded to image boundary.\"\n}"}}, {"i": 69, "name": "ras.reproject", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "多源数据统一坐标系（国产影像常为 CGCS2000）", "desc_raw": "Reproject a raster from its current CRS to a target CRS. Useful for aligning multi-source data (e.g., optical + SAR, DEM + damage mask) so downstream operations can be performed in a common coordinate system.", "plain": "把影像换到统一的坐标系。国产数据常是 CGCS2000、国际数据多是 WGS84，不统一就没法叠在一张图上。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "raster_path", "type": "str", "required": true, "default": null, "desc": "栅格路径"}, {"name": "dst_crs", "type": "str", "required": true, "default": null, "desc": "Target CRS as an EPSG code (e.g., \"EPSG:32636\")"}, {"name": "resampling", "type": "str", "required": false, "default": "'bilinear'", "desc": "重采样方法：nearest / bilinear / cubic"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to the reprojected raster"}, {"name": "src_crs", "type": "str", "desc": "Original CRS"}, {"name": "dst_crs", "type": "str", "desc": "New CRS"}, {"name": "shape", "type": "list[int", "desc": "[height, width]"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "raster_path dst_crs resampling out_path", "py": "from dora.tools.analysis import ras_reproject\nimport json\nres = json.loads(ras_reproject(raster_path=\"input.tif\", dst_crs=\"\"input.tif\"\"))", "json": "{\n  \"name\": \"ras.reproject\",\n  \"arguments\": {\n    \"raster_path\": \"input.tif\",\n    \"dst_crs\": \"\\\"input.tif\\\"\"\n  }\n}", "ex": {"inputs": ["images/landslide4sense/Japan_all_14_dem.tif（EPSG:4326，高程米）"], "in": "../examples/40-栅格分析/ras.reproject/in.webp", "img": "../examples/40-栅格分析/ras.reproject/out.webp", "cap": "上：投影前（经纬度栅格）；下：投影后（UTM 54N，米制像元）", "note": "坡度、缓冲区、最短路这类按「米」算的步骤，都应先投影到米制坐标系。", "status": "real", "out": "{\n  \"tool\": \"ras.reproject\",\n  \"output_path\": \"<temp_dir>/reprojected.tif\",\n  \"src_crs\": \"EPSG:4326\",\n  \"dst_crs\": \"EPSG:32654\",\n  \"shape\": [\n    1675,\n    1713\n  ]\n}"}}, {"i": 70, "name": "ras.resample", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "统一 GSD：模型对分辨率敏感，这一步不能省", "desc_raw": "Resample a raster to a new pixel size. Useful for harmonizing resolution between multi-source data (e.g., resampling a coarser grid to a finer target resolution).", "plain": "把影像缩放到指定分辨率。模型对「一像素代表多少米」很敏感，喂进去之前基本都要这一步。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "raster_path", "type": "str", "required": true, "default": null, "desc": "栅格路径"}, {"name": "target_pixel_size_m", "type": "float", "required": true, "default": null, "desc": "Desired pixel size in meters"}, {"name": "resampling", "type": "str", "required": false, "default": "'bilinear'", "desc": "重采样方法：nearest / bilinear / cubic"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to the resampled raster"}, {"name": "src_pixel_size_m", "type": "float", "desc": "Original pixel size"}, {"name": "dst_pixel_size_m", "type": "float", "desc": "New pixel size"}, {"name": "shape", "type": "list[int", "desc": "[height, width]"}], "boundary": "", "pitfall": "", "tip": "模型对分辨率敏感，接入前这一步不能省。降采样只改像素，不改类别语义——3.2 m 时「部分损毁」会塌得比「完全损毁」更快。", "keywords": "raster_path target_pixel_size_m resampling out_path", "py": "from dora.tools.analysis import ras_resample\nimport json\nres = json.loads(ras_resample(raster_path=\"input.tif\", target_pixel_size_m=\"0.0\"))", "json": "{\n  \"name\": \"ras.resample\",\n  \"arguments\": {\n    \"raster_path\": \"input.tif\",\n    \"target_pixel_size_m\": \"0.0\"\n  }\n}", "ex": {"inputs": ["images/landslide4sense/Japan_all_14_sentinel.tif（12 波段，EPSG:4326）"], "in": "", "img": "../examples/40-栅格分析/ras.resample/out.webp", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"ras.resample\",\n  \"output_path\": \"<temp_dir>/resampled.tif\",\n  \"src_pixel_size_m\": 0.00012944888281104716,\n  \"dst_pixel_size_m\": 20.0,\n  \"shape\": [\n    1,\n    1\n  ]\n}"}}, {"i": 71, "name": "ras.sample_point", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "站点/断面取值", "desc_raw": "Sample pixel value at a specific (row, col) location in a raster image.", "plain": "给一个坐标，返回那里图上的数值。想查某个水文站、某个村口的水深或温度，就用它。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "row", "type": "int", "required": true, "default": null, "desc": "Pixel row (y coordinate)"}, {"name": "col", "type": "int", "required": true, "default": null, "desc": "Pixel column (x coordinate)"}], "returns": [{"name": "row", "type": "int", "desc": "Input row coordinate"}, {"name": "col", "type": "int", "desc": "Input column coordinate"}, {"name": "pixel_values", "type": "dict", "desc": "Pixel value for each band (1-indexed)"}, {"name": "is_inside", "type": "bool", "desc": "Whether the coordinates are within image bounds"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path row col", "py": "from dora.tools.analysis import ras_sample_point_tool\nimport json\nres = json.loads(ras_sample_point_tool(image_path=\"input.tif\", row=\"1\", col=\"1\"))", "json": "{\n  \"name\": \"ras.sample_point\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"row\": \"1\",\n    \"col\": \"1\"\n  }\n}", "ex": {"inputs": ["images/landslide4sense/Japan_all_14_sentinel.tif（12 波段，EPSG:4326）"], "in": "../examples/40-栅格分析/ras.sample_point/in.webp", "img": "", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"ras.sample_point\",\n  \"row\": 512,\n  \"col\": 512,\n  \"pixel_values\": {\n    \"1\": 1332,\n    \"2\": 981,\n    \"3\": 935,\n    \"4\": 755,\n    \"5\": 1249,\n    \"6\": 1958,\n    \"7\": 2280,\n    \"8\": 2700,\n    \"9\": 872,\n    \"10\": 16,\n    \"11\": 2093,\n    \"12\": 1122\n  },\n  \"is_inside\": true\n}"}}, {"i": 72, "name": "ras.sample_points", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "水文站点批量采样", "desc_raw": "Sample pixel values at multiple locations in a raster image.", "plain": "一次查很多个点，返回一张表。适合把几十上百个站点的值一次取出来。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "points", "type": "list[dict]", "required": true, "default": null, "desc": "点要素列表"}], "returns": [{"name": "total_points", "type": "int", "desc": "Number of input points"}, {"name": "results", "type": "list", "desc": "List of {row, col, pixel_values, is_inside} for each point"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path points", "py": "from dora.tools.analysis import ras_sample_points_tool\nimport json\nres = json.loads(ras_sample_points_tool(image_path=\"input.tif\", points=\"input.tif\"))", "json": "{\n  \"name\": \"ras.sample_points\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"points\": \"input.tif\"\n  }\n}", "ex": {"inputs": ["images/landslide4sense/Japan_all_14_sentinel.tif（12 波段，EPSG:4326）"], "in": "../examples/40-栅格分析/ras.sample_points/in.webp", "img": "../examples/40-栅格分析/ras.sample_points/out.webp", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"ras.sample_points\",\n  \"image_path\": \"<DORA_DATA>/images/landslide4sense/Japan_all_14_sentinel.tif\",\n  \"total_points\": 2,\n  \"results\": [\n    {\n      \"row\": 100,\n      \"col\": 120,\n      \"pixel_values\": {\n        \"1\": 1292,\n        \"2\": 900,\n        \"3\": 692,\n        \"4\": 517,\n        \"5\": 738,\n        \"6\": 1186,\n        \"7\": 1401,\n        \"8\": 1354,\n        \"9\": 865,\n        \"10\": 17,\n        \"11\": 1411,\n        \"12\": 756\n      },\n      \"is_inside\": true\n    },\n    {\n      \"row\": 300,\n      \"col\": 400,\n      \"pixel_values\": {\n        \"1\": 1353,\n        \"2\": 1028,\n        \"3\": 939,\n        \"4\": 999,\n        \"5\": 1528,\n        \"6\": 2332,\n        \"7\": 2732,\n        \"8\": 2624,\n        \"9\": 1026,\n        \"10\": 16,\n        \"11\": 2744,\n        \"12\": 1474\n      },\n      \"is_inside\": true\n    }\n  ]\n}"}}, {"i": 73, "name": "ras.stats", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "水位/温度/降水量的区域统计", "desc_raw": "Compute summary statistics for one raster band while ignoring nodata values.", "plain": "给一张图算几个基本数字：最小、最大、平均、以及起伏有多大。用来快速判断这片区域整体什么情况，比如全县平均降雨、平均地表温度。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "band", "type": "int", "required": false, "default": "1", "desc": "波段号，从 1 开始"}, {"name": "ignore_nodata", "type": "bool", "required": false, "default": "True", "desc": "Ignore nodata and NaN values. Default is true"}], "returns": [{"name": "min", "type": "float|None", "desc": "Minimum valid value"}, {"name": "max", "type": "float|None", "desc": "Maximum valid value"}, {"name": "mean", "type": "float|None", "desc": "Mean valid value"}, {"name": "std", "type": "float|None", "desc": "Standard deviation of valid values"}, {"name": "valid_pixels", "type": "int", "desc": "Number of valid pixels used"}, {"name": "band", "type": "int", "desc": "Band index used"}, {"name": "nodata", "type": "float|None", "desc": "Raster nodata value"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path band ignore_nodata", "py": "from dora.tools.analysis import ras_stats\nimport json\nres = json.loads(ras_stats(image_path=\"input.tif\"))", "json": "{\n  \"name\": \"ras.stats\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\"\n  }\n}", "ex": {"inputs": ["Japan_all_14_sentinel.tif 第 4 波段"], "in": "", "img": "", "cap": "", "note": "单波段统计，整幅一次约 1 秒，不走模型。", "status": "real", "out": "{\n  \"tool\": \"ras.stats\",\n  \"image_path\": \"<DORA_DATA>/images/landslide4sense/Japan_all_14_sentinel.tif\",\n  \"band\": 4,\n  \"nodata\": 0.0,\n  \"min\": 265.0,\n  \"max\": 13001.0,\n  \"mean\": 668.584420944806,\n  \"std\": 270.81311003499343,\n  \"valid_pixels\": 2655360\n}"}}, {"i": 74, "name": "ras.threshold", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "最通用的一招：LST/NDVI/水深/降水栅格都能阈值化", "desc_raw": "Create a binary mask by thresholding one raster band.", "plain": "把一张图里符合某个数值条件的区域涂白、其余涂黑。比如只保留温度高于 35 度的地方，或者只保留水深超过 0.5 米的地方——一次就能圈出范围，不用另训模型。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "threshold", "type": "float", "required": true, "default": null, "desc": "阈值"}, {"name": "op", "type": "str", "required": false, "default": "'>='", "desc": "比较运算符：`>=` `>` `<=` `<` `==`"}, {"name": "band", "type": "int", "required": false, "default": "1", "desc": "波段号，从 1 开始"}, {"name": "true_value", "type": "int", "required": false, "default": "255", "desc": "命中像元写入的值"}, {"name": "false_value", "type": "int", "required": false, "default": "0", "desc": "未命中像元写入的值"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to threshold mask in TEMP_DIR"}, {"name": "selected_pixels", "type": "int", "desc": "Number of pixels passing the threshold"}, {"name": "threshold", "type": "float", "desc": "Input threshold"}, {"name": "op", "type": "str", "desc": "Comparison operator used"}], "boundary": "只做单波段二值化，不能做波段比值（算不了 NDVI/NDWI，那是缺口）。", "pitfall": "", "tip": "SAR 水体最实用的下限基线：VV < −16 dB 得 IoU 0.267，零权重、801 次调用零报错。任何新模型要先超过它。", "keywords": "image_path threshold op band true_value false_value", "py": "from dora.tools.analysis import ras_threshold\nimport json\nres = json.loads(ras_threshold(image_path=\"input.tif\", threshold=\"0.0\"))", "json": "{\n  \"name\": \"ras.threshold\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"threshold\": \"0.0\"\n  }\n}", "ex": {"inputs": ["Japan_all_14_sentinel.tif 第 7 波段（近红外）"], "in": "", "img": "../examples/40-栅格分析/ras.threshold/out.webp", "cap": "影像｜阈值掩膜｜叠加（亮像元 > 1200）", "note": "阈值法零成本、可解释，但没有语义；找水体/裸土够用，找「滑坡」不行。", "status": "real", "out": "{\n  \"tool\": \"ras.threshold\",\n  \"image_path\": \"<DORA_DATA>/images/landslide4sense/Japan_all_14_sentinel.tif\",\n  \"mask_path\": \"<temp_dir>/Japan_all_14_sentinel_thr_gt_1200.0_7ede90.tif\",\n  \"threshold\": 1200.0,\n  \"op\": \">\",\n  \"band\": 7,\n  \"selected_pixels\": 2010844,\n  \"true_value\": 255,\n  \"false_value\": 0\n}"}}, {"i": 75, "name": "ras.vectorize", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "淹没范围出图、与行政区叠加的前提", "desc_raw": "Vectorize a raster mask to extract polygons for specified classes. Converts pixel-based mask to vector polygons with area statistics and saves GeoJSON. This tool facilitates the later vector-based processing.", "plain": "把黑白的范围图转成 GIS 里能编辑、能叠加的面数据，每一块还自带面积。要在行政区上算数、要出彩色范围图，都得先走这一步。", "dep": "rasterio+geo", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "mask_path", "type": "str", "required": true, "default": null, "desc": "掩膜路径（二值或多类）"}, {"name": "classes", "type": "list[int]", "required": true, "default": null, "desc": "要保留的类别值列表"}, {"name": "pixel_size_m", "type": "float", "required": false, "default": "None", "desc": "像元边长（米）。掩膜无地理参考时必须显式给出"}], "returns": [{"name": "vector_path", "type": "str", "desc": "Path to the saved vector GeoJSON"}, {"name": "polygons", "type": "list", "desc": "List of polygon properties (id/class/pixel_count/area_m2)"}, {"name": "count", "type": "int", "desc": "Number of polygons extracted"}, {"name": "total_pixels", "type": "int", "desc": "Total pixel count for the classes"}, {"name": "total_area_m2", "type": "float|None", "desc": "Total area in m2 if pixel_size_m provided"}], "boundary": "", "pitfall": "", "tip": "输出多边形自带 `area_m2`；碎斑用 `vec.filter_by_area` 清，再 `vec.intersect` 叠行政区。", "keywords": "mask_path classes pixel_size_m", "py": "from dora.tools.analysis import ras_vectorize\nimport json\nres = json.loads(ras_vectorize(mask_path=\"mask.png\", classes=\"input.tif\"))", "json": "{\n  \"name\": \"ras.vectorize\",\n  \"arguments\": {\n    \"mask_path\": \"mask.png\",\n    \"classes\": \"input.tif\"\n  }\n}", "ex": {"inputs": ["seg.building_damage 掩膜（类别 2、3）"], "in": "../examples/40-栅格分析/ras.vectorize/in.webp", "img": "../examples/40-栅格分析/ras.vectorize/out.webp", "cap": "上：灾后影像；下：矢量化后的建筑轮廓（橙线，26 个面）", "note": "相邻像元会合并成一个面；细碎图斑建议接 vec.filter_by_area 清理。", "status": "real", "out": "{\n  \"tool\": \"ras.vectorize\",\n  \"vector_path\": \"<temp_dir>/mask_damage_class_2_3_609f5c.geojson\",\n  \"count\": 26,\n  \"total_pixels\": 27959,\n  \"total_area_m2\": 17893.76\n}"}}, {"i": 76, "name": "ras.catchment", "module": "terrain", "domain": "terrain", "relevance": "★★★", "transfer": "A", "desc_cn": "给定出水口反查上游汇水区，洪水预报的单元划分", "desc_raw": "Delineate the catchment (watershed / contributing area) upstream of one or more pour points. Reuses the same depression filling, D8 routing and flow accumulation as ras.flow, then walks the flow graph backwards from each outlet. Each cell is assigned to the first outlet it reaches on its way downstr", "plain": "回答「这片地方下的雨，最后都从哪儿流出去」。给一个出水口（下游的桥、堤防缺口、水库入口都行），它把上游所有会往这里汇水的地面圈出来，并算出面积。洪水预报要按流域算「下了多少雨、会涨多少水」，第一步就是这件事。", "dep": "numpy / shapely", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "pour_points", "type": "str?", "required": false, "default": "None", "desc": "出水口坐标，`x,y` 或 `x,y;x,y`；省略则自动取边界最低格"}, {"name": "pour_crs", "type": "str", "required": false, "default": "'same'", "desc": "坐标口径：`same`（与 DEM 同 CRS）/ `wgs84`（经纬度）/ `pixel`（列,行）"}, {"name": "snap_radius_m", "type": "float", "required": false, "default": "0.0", "desc": "在半径内把出水口吸附到汇流量最大的格（0 = 不吸附）"}, {"name": "min_area_cells", "type": "int", "required": false, "default": "1", "desc": "Drop catchments smaller than this and report them (default 1)"}, {"name": "simplify_m", "type": "float", "required": false, "default": "0.0", "desc": "线简化容差（米）。5–15 可抹掉栅格锯齿，几何更干净、长度略短"}, {"name": "out_dir", "type": "str?", "required": false, "default": "None", "desc": "Output directory; defaults to the session temp directory"}, {"name": "out_geojson", "type": "str?", "required": false, "default": "None", "desc": "GeoJSON path for the polygons"}], "returns": [{"name": "outlets", "type": "list", "desc": "per outlet - pixel, cells, area_km2, elevation range, border contact"}, {"name": "paths", "type": "dict", "desc": "catchment label raster (1..n) and the GeoJSON polygons"}, {"name": "truncation", "type": "dict", "desc": "how much of the catchment touches the tile edge, and what that implies"}, {"name": "warnings", "type": "list", "desc": "pour points that control almost no area, etc."}], "boundary": "D8 单流向，出水口必须落在**汇流路径**上：落在山脊或坡面中段只会圈出 1 格，工具会给出警告并建议设 `snap_radius_m`。实测 V 形谷（64×64）单点圈出全部 4096 格、面积 0.4096 km² 与手算一致；真实 12 m DEM（900×900，81 万像元）得 100.9 km²，含填洼共 6.9 s。图幅边界是硬限制：**触边时面积只是下界**。", "pitfall": "触边不等于被截断——分水岭可能恰好压在边界上。所以要读三个数而不是一个布尔值：`border_cells`（多少格贴边）、`max_accumulation_on_border`（边界上最大的汇流量，远大于 1 说明有一条河被切断）、`exits_on_border`（有几处水流出图外）。只有第一个数大、第二个数还是 1，通常是真的没啥可丢。", "tip": "出水口不用手量：先跑 `ras.flow`，累积量最大的一格就是本图主河道最下游。要给一组子流域就一次给多个点——结果是**互斥分区**：上游点管它以上、下游点管两点之间那段，面积正好相加（实测 2112 + 1984 = 4096），适合按子流域分区统计。要完整的嵌套流域（下游含上游）就单独跑下游那一个点。", "keywords": "dem_path pour_points pour_crs snap_radius_m min_area_cells simplify_m out_dir out_geojson", "py": "from dora.tools.terrain import ras_catchment\nimport json\nres = json.loads(ras_catchment(dem_path=\"dem.tif\"))", "json": "{\n  \"name\": \"ras.catchment\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\"\n  }\n}", "ex": {"inputs": ["同一块 900×900 子区（EPSG:32654，像元 12 m）；出水口取汇流面的最大值格"], "in": "../examples/30-地形与地表变化/ras.catchment/in.webp", "img": "../examples/30-地形与地表变化/ras.catchment/out.webp", "cap": "流域 100.9 km²（占图幅 86%），出口在图幅边界；847 格触边", "note": "出口坐标由 ras.flow 的汇流面给出：累积量最大的一格就是本图主河道最下游，沿河道往上游反查就是流域。这里出口正好落在图幅左边界，所以面积是下界——左边界外还有上游未计入。", "status": "real", "out": "{\n  \"tool\": \"ras.catchment\",\n  \"outlets\": [\n    {\n      \"id\": 1,\n      \"pour_point\": [\n        574995.17,\n        4734193.91\n      ],\n      \"pour_crs\": \"same\",\n      \"pixel\": [\n        666,\n        0\n      ],\n      \"snapped\": false,\n      \"snap_distance_m\": 0.0,\n      \"cells\": 699036,\n      \"area_km2\": 100.9496,\n      \"share_of_tile\": 0.863,\n      \"elevation_range_m\": [\n        25.0,\n        420.0\n      ],\n      \"outlet_accumulation\": 699036.0,\n      \"touches_border\": true,\n      \"border_cells\": 847,\n      \"border_by_side\": {\n        \"top\": 307,\n        \"bottom\": 279,\n        \"left\": 31,\n        \"right\": 230\n      }\n    }\n  ],\n  \"paths\": {\n    \"catchment\": \"<temp_dir>/catchment.tif\",\n    \"catchment_geojson\": \"<temp_dir>/catchment.geojson\"\n  },\n  \"truncation\": {\n    \"touches_border\": true,\n    \"border_cells\": 847,\n    \"by_side\": {\n      \"top\": 307,\n      \"bottom\": 279,\n      \"left\": 31,\n      \"right\": 230\n    },\n    \"outlet_on_border\": true,\n    \"exits_on_border\": 1,\n    \"max_accumulation_on_border\": 699036.0,\n    \"may_be_incomplete\": true,\n    \"note\": \"847 catchment cell(s) lie on the tile edge (top 307, bottom 279, left 31, right 230). The DEM ends there, so whatever drains in from beyond it is invisible and the reported area is a lower bound. The outlet itself is on the edge, so the downstream part is outside too. The largest accumulation on the edge is 699036 cells - a large value means a channel is severed by the boundary and closing it with the neighbouring tile matters.\",\n    \"how_to_close\": \"Mosaic the neighbouring tiles, or buffer the DEM by a few km and re-run, if "}}, {"i": 77, "name": "ras.contour", "module": "terrain", "domain": "terrain", "relevance": "★★", "transfer": "A", "desc_cn": "等高线出图、坡度分级底图", "desc_raw": "Extract contour lines (isolines) from a DEM at a fixed interval and write them as GeoJSON LineStrings with the elevation as an attribute. Useful for cartography and for slope-class base maps.", "plain": "把高程图切成一条条等高线，导出成 GIS 能直接打开的线数据，每条线带自己的高程值。做地形图、坡度分级底图、给非专业读者看「这地方有多陡」时最直观。", "dep": "skimage", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "interval", "type": "float", "required": true, "default": null, "desc": "等高距（与 DEM 同单位，通常为米）"}, {"name": "base", "type": "float?", "required": false, "default": "None", "desc": "First contour level; defaults to the next multiple of interval"}, {"name": "min_length", "type": "float", "required": false, "default": "0.0", "desc": "丢弃短于该长度的线（米）"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "out_path", "type": "str", "desc": "GeoJSON with one feature per contour line"}, {"name": "n_lines", "type": "int", "desc": "Number of lines written"}, {"name": "levels", "type": "list[float", "desc": "Contour levels present in the output"}, {"name": "total_length_m", "type": "float", "desc": "Summed length of all lines"}], "boundary": "输出是**等值线矢量**，不做平滑也不做抽稀；地形噪声大时线会很碎，先用 `ras.focal_stats` 平滑。", "pitfall": "`interval` 小于高程噪声时会产生大量闭合小环；DEM 有空洞（NaN）时，空洞边缘会被当作低地，出现假等高线。", "tip": "出图配 `ras.hillshade` 做底最直观；进 GIS 后按 `elevation` 属性分级设色即可。", "keywords": "dem_path interval base min_length out_path", "py": "from dora.tools.terrain import ras_contour\nimport json\nres = json.loads(ras_contour(dem_path=\"dem.tif\", interval=\"0.0\"))", "json": "{\n  \"name\": \"ras.contour\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\",\n    \"interval\": \"0.0\"\n  }\n}", "ex": {"inputs": ["UTM DEM（12 m），等高距 100 m"], "in": "../examples/30-地形与地表变化/ras.contour/in.webp", "img": "../examples/30-地形与地表变化/ras.contour/out.webp", "cap": "红线为等高线：363 条、总长 1580 km", "note": "输出是 GeoJSON，每条线带 elevation，可直接进 QGIS/ArcGIS 或叠加到专题图上。", "status": "real", "out": "{\n  \"tool\": \"ras.contour\",\n  \"out_path\": \"<temp_dir>/contour.geojson\",\n  \"n_lines\": 363,\n  \"levels\": [\n    100.0,\n    200.0,\n    300.0,\n    \"…（共 4 条，此处省略）\"\n  ],\n  \"total_length_m\": 1579690.7,\n  \"interval\": 100.0,\n  \"elevation_range\": [\n    12.0,\n    482.0\n  ]\n}"}}, {"i": 78, "name": "ras.flow", "module": "terrain", "domain": "terrain", "relevance": "★★★", "transfer": "A", "desc_cn": "填洼→流向→汇流，流域提取与洪水演进的前置", "desc_raw": "Hydrological terrain analysis: fill depressions, compute D8 flow direction and flow accumulation, and optionally extract a river network above an accumulation threshold. This is the physical starting point for catchment and flood-routing work, which the upstream library does not cover.", "plain": "模拟水往哪儿流：先把坑坑洼洼填平，再让每一格的水沿着最陡的方向流走，最后数出每个位置汇集了多少上游来水。汇流量大的地方就是河；给定一个出水口，反推回来就是它的流域。洪水预报里「上游下了雨、下游什么时候涨」这条链，从这里开始。", "dep": "numpy", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "fill", "type": "bool", "required": false, "default": "True", "desc": "Fill depressions before routing (default True)"}, {"name": "epsilon", "type": "float", "required": false, "default": "0.0001", "desc": "填洼时的抬升步长（米），给平地一个微梯度"}, {"name": "river_threshold", "type": "int?", "required": false, "default": "None", "desc": "以**格数**给的阈值，会覆盖 `min_area_km2`（与 `ras.flow` 口径一致）"}, {"name": "out_dir", "type": "str?", "required": false, "default": "None", "desc": "Directory for the outputs; defaults to the session temp directory"}], "returns": [{"name": "paths", "type": "dict", "desc": "filled DEM, flow direction, flow accumulation, optional river raster"}, {"name": "stats", "type": "dict", "desc": "max accumulation, number of outlets, filled cell count"}, {"name": "cell_size_m", "type": "dict", "desc": "Cell size used (degrees are converted to metres)"}], "boundary": "D8 单流向，**不适用于平坦的灌区、湿地、城市管网**——那些地方需要 D-inf 或水文模型。填洼会把真实洼地（岩溶、采煤沉陷）也填平，做沉降分析时要用 `fill=False`。", "pitfall": "ε 梯度决定平坦区的流向，**结果对 ε 敏感**：同一 DEM 换 ε 只改变平地内部的水路，不影响主河道，但会让「某块地属于哪个流域」在分水线附近摆动。", "tip": "`river_threshold` 取 500–1000 个像元通常能得到接近实测的河网密度；先看汇流累积图再定阈值，比拍数字可靠。", "keywords": "dem_path fill epsilon river_threshold out_dir", "py": "from dora.tools.terrain import ras_flow\nimport json\nres = json.loads(ras_flow(dem_path=\"dem.tif\"))", "json": "{\n  \"name\": \"ras.flow\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\"\n  }\n}", "ex": {"inputs": ["同一 DEM 的 900×900 子区（EPSG:32654）"], "in": "../examples/30-地形与地表变化/ras.flow/in.webp", "img": "../examples/30-地形与地表变化/ras.flow/out.webp", "cap": "左：填洼后的地形，蓝色为汇流量 ≥800 的河段；右：汇流累积（对数）", "note": "先填洼再定流向：不填洼的话，每一个小坑都会变成假的水系断点。给定出水口用同样的汇流面反查，就是流域边界。", "status": "real", "out": "{\n  \"tool\": \"ras.flow\",\n  \"paths\": {\n    \"filled\": \"<temp_dir>/flow_filled.tif\",\n    \"flow_direction\": \"<temp_dir>/flow_direction.tif\",\n    \"flow_accumulation\": \"<temp_dir>/flow_accumulation.tif\",\n    \"river\": \"<temp_dir>/flow_river.tif\"\n  },\n  \"stats\": {\n    \"max_accumulation\": 699036.0,\n    \"outlet_count\": 418,\n    \"filled_cells\": 45682,\n    \"river_cells\": 16593\n  },\n  \"cell_size_m\": {\n    \"x\": 12.017180807112608,\n    \"y\": 12.017180807112608,\n    \"note\": null\n  },\n  \"shape\": [\n    900,\n    900\n  ]\n}"}}, {"i": 79, "name": "ras.geomorphons", "module": "terrain", "domain": "terrain", "relevance": "★★★", "transfer": "A", "desc_cn": "10 类地貌单元分类，地貌分区与易发性解释变量", "desc_raw": "Classify every DEM cell into one of the ten common landform units - flat, peak, ridge, shoulder, spur, slope, hollow, footslope, valley, pit - using the geomorphon method of Jasiewicz & Stepinski (2013). Terrain is read as a pattern, not as derivatives: from each cell eight rays are cast and each re", "plain": "把地形分成十种「长相」：山顶、山脊、坡肩、山嘴、坡面、凹槽、坡脚、谷底、坑、平地。它回答的不是「多陡」，而是「这是什么部位」——做地貌分区、给滑坡或洪水模型找解释变量时用得上。注意它看的是局部：换一个观察半径，同一座山会被分成不同的单元。", "dep": "numpy", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "search_distance", "type": "int", "required": false, "default": "10", "desc": "搜索半径（格）。它决定「多大的地貌单元」，不是精度参数"}, {"name": "flatness_deg", "type": "float", "required": false, "default": "1.0", "desc": "「多平算平」的阈值（度）。平原区调到 2–3 可减少碎斑"}, {"name": "skip_distance", "type": "int", "required": false, "default": "0", "desc": "Ignore this many cells next to the centre, to suppress noise (default 0)"}, {"name": "return_pattern", "type": "bool", "required": false, "default": "False", "desc": "Also write the ternary pattern code per cell, for diagnosis"}, {"name": "out_dir", "type": "str?", "required": false, "default": "None", "desc": "Directory for the outputs; defaults to the session temp directory"}], "returns": [{"name": "path", "type": "str", "desc": "Categorical raster, values 1-10"}, {"name": "classes", "type": "dict", "desc": "code -> name"}, {"name": "share", "type": "dict", "desc": "fraction of valid cells in each class"}, {"name": "pattern_path", "type": "str", "desc": "present only when return_pattern is true"}, {"name": "cell_size_m", "type": "dict", "desc": "Cell size used (degrees are converted to metres)"}], "boundary": "结果**显式依赖尺度**：同一地形在 10 格与 30 格搜索半径下，脊和谷的位置会移动、数量会变（实测 900×900 / 81 万像元，search=10 用 1.4 s、search=30 用 2.4 s）。分类也是相对的：「坡」不代表没有起伏，只是八个方向里上坡与下坡各占一半。类别判定用的是 **`r.geomorphon` 官方查找表**（行=向下视线数、列=向上视线数），视线长度按真实距离截断（对角方向走 √2 倍，步数更少），与 GRASS 的 anglev1 一致。", "pitfall": "**不要把类别当成绝对地貌类型**。geomorphon 只描述局部八个方向的可见起伏，不含成因——河流阶地、冰碛垄、喀斯特洼地在它看来都只是「坡」或「坑」。做地貌分区时要再叠高程带、坡度带或地质图，别指望它一个顶三个。", "tip": "两个参数决定结果：`search_distance` 定尺度（想要多大的地貌单元就设多大，默认 10 格；GRASS 默认是 3 格，看的是更小的微地貌），`flatness_deg` 定「多平算平」（平原区调到 2–3° 可明显减少碎斑）。拿不准就同一块地跑两个尺度再对比，比调参猜更可靠。", "keywords": "dem_path search_distance flatness_deg skip_distance return_pattern out_dir", "py": "from dora.tools.terrain import ras_geomorphons\nimport json\nres = json.loads(ras_geomorphons(dem_path=\"dem.tif\"))", "json": "{\n  \"name\": \"ras.geomorphons\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\"\n  }\n}", "ex": {"inputs": ["同一块 900×900 子区（EPSG:32654，像元 12 m），两个搜索半径"], "in": "../examples/30-地形与地表变化/ras.geomorphons/in.webp", "img": "../examples/30-地形与地表变化/ras.geomorphons/out.webp", "cap": "中：10 格（约 120 m）尺度，坡面 34%、谷 13.6%；右：30 格（约 360 m）尺度，同一地形被归并成更大的单元", "note": "地貌分类没有「正确答案」，只有「什么尺度上的答案」：search_distance 定多大，被认作脊和谷的东西就多大。这张图里 10 格尺度下前三类是 slope、spur、hollow；放到 30 格，支沟被合并，坡面比例上升、谷和脊的位置往外移。换个尺度再跑一遍，是这类工具的正确用法。", "status": "real", "out": "{\n  \"tool\": \"ras.geomorphons\",\n  \"path\": \"<temp_dir>/geom10/geomorphons.tif\",\n  \"paths\": {\n    \"geomorphons\": \"<temp_dir>/geom10/geomorphons.tif\"\n  },\n  \"classes\": {\n    \"1\": \"flat\",\n    \"2\": \"peak\",\n    \"3\": \"ridge\",\n    \"4\": \"shoulder\",\n    \"5\": \"spur\",\n    \"6\": \"slope\",\n    \"7\": \"hollow\",\n    \"8\": \"footslope\",\n    \"9\": \"valley\",\n    \"10\": \"pit\"\n  },\n  \"share\": {\n    \"flat\": 0.001,\n    \"peak\": 0.0166,\n    \"ridge\": 0.1404,\n    \"shoulder\": 0.0032,\n    \"spur\": 0.1919,\n    \"slope\": 0.3415,\n    \"hollow\": 0.1498,\n    \"footslope\": 0.0056,\n    \"valley\": 0.1363,\n    \"pit\": 0.0137\n  },\n  \"counts\": {\n    \"flat\": 771,\n    \"peak\": 13478,\n    \"ridge\": 113725,\n    \"shoulder\": 2579,\n    \"spur\": 155463,\n    \"slope\": 276654,\n    \"hollow\": 121324,\n    \"footslope\": 4527,\n    \"valley\": 110381,\n    \"pit\": 11098\n  },\n  \"params\": {\n    \"search_distance\": 10,\n    \"flatness_deg\": 1.0,\n    \"skip_distance\": 0\n  },\n  \"cell_size_m\": {\n    \"x\": 12.017180807112608,\n    \"y\": 12.017180807112608,\n    \"note\": null\n  },\n  \"shape\": [\n    900,\n    900\n  ]\n}"}}, {"i": 80, "name": "ras.hillshade", "module": "analysis", "domain": "terrain", "relevance": "★★★", "transfer": "A", "desc_cn": "地形地貌可视化、滑坡/泥石流易发性底图", "desc_raw": "Compute a hillshade image from a Digital Elevation Model (DEM) raster, revealing terrain relief. Uses the standard Horn (1981) formulation with configurable sun azimuth and altitude angles. Useful for landslide and debris-flow susceptibility mapping.", "plain": "用高程数据做出一张带光影的地形图，山脊、沟谷一眼能看出来，常拿来当底图。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "azimuth", "type": "float", "required": false, "default": "315.0", "desc": "光源方位角（度）"}, {"name": "altitude", "type": "float", "required": false, "default": "45.0", "desc": "光源高度角（度）"}, {"name": "z_factor", "type": "float", "required": false, "default": "1.0", "desc": "高程夸张系数"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "hillshade_path", "type": "str", "desc": "Path to the generated hillshade image"}, {"name": "shape", "type": "list[int", "desc": "[height, width] of the output"}, {"name": "stats", "type": "dict", "desc": "min, max, mean of hillshade values (0-255)"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "dem_path azimuth altitude z_factor out_path", "py": "from dora.tools.analysis import ras_hillshade\nimport json\nres = json.loads(ras_hillshade(dem_path=\"dem.tif\"))", "json": "{\n  \"name\": \"ras.hillshade\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\"\n  }\n}", "ex": {"inputs": ["images/landslide4sense/Japan_all_14_dem.tif"], "in": "", "img": "../examples/30-地形与地表变化/ras.hillshade/out.webp", "cap": "山体阴影（315° 方位、45° 高度角）", "note": "只影响观感，不改变高程；做地形晕渲或叠加专题图时用。", "status": "real", "out": "{\n  \"tool\": \"ras.hillshade\",\n  \"hillshade_path\": \"<temp_dir>/hillshade.tif\",\n  \"shape\": [\n    1384,\n    1922\n  ],\n  \"stats\": {\n    \"min\": 0,\n    \"max\": 180,\n    \"mean\": 63.519059054573454\n  }\n}"}}, {"i": 81, "name": "ras.river_network", "module": "terrain", "domain": "terrain", "relevance": "★★★", "transfer": "A", "desc_cn": "河网矢量化为河段并做 Strahler 分级，洪水演进与水质的基本单元", "desc_raw": "Vectorise the D8 drainage network into reaches and order them with the Strahler scheme. A reach is the chain of cells between two junctions (or between a source and the first junction); its order is 1 at a source and, at a confluence, the maximum of the incoming orders - raised by one only when ever", "plain": "把地图上的河网从像素抽成一条条「河段」，并给每条编号分级：两条一级沟汇成才算二级，只有两条同级河段汇合才再升一级——所以数字跳得很慢，4 级往往已经是整幅图的主干。洪水演进、水质模型都按河段算，因为不同级数的河段在宽度、坡度、汇水面积上差别很大。", "dep": "numpy / shapely", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "min_area_km2", "type": "float", "required": false, "default": "1.0", "desc": "集水面积下限（km²）：一条沟要汇集这么多水才算河。常用 0.5–2"}, {"name": "river_threshold", "type": "int?", "required": false, "default": "None", "desc": "以**格数**给的阈值，会覆盖 `min_area_km2`（与 `ras.flow` 口径一致）"}, {"name": "fill", "type": "bool", "required": false, "default": "True", "desc": "Fill depressions before routing (default True)"}, {"name": "simplify_m", "type": "float", "required": false, "default": "0.0", "desc": "线简化容差（米）。5–15 可抹掉栅格锯齿，几何更干净、长度略短"}, {"name": "out_dir", "type": "str?", "required": false, "default": "None", "desc": "Directory for the outputs; defaults to the session temp directory"}], "returns": [{"name": "paths", "type": "dict", "desc": "reaches (GeoJSON), nodes (GeoJSON), Strahler-order raster"}, {"name": "stats", "type": "dict", "desc": "reach/junction/outlet counts, maximum order, total length"}, {"name": "by_order", "type": "dict", "desc": "reach count and length per Strahler order"}], "boundary": "级数是**图幅内**的级数：DEM 到边界就断了，出图口之外的河段不参与编号（实测 4–6 处出图，阈值越细越多）。同一块地裁大一点，主干可能从 3 级变 4 级，这不是算错。阈值决定密度：0.5 km² 出 102 段、1 km² 出 62 段、2 km² 只剩 24 段（900×900 / 81 万像元，含填洼 8–9 s）。", "pitfall": "Strahler 不是「大小排名」：一条一级支流并入二级干流，干流仍是二级，不会升到三级——**只有两条同级河段汇合才加一**。要看「汇集了多少条沟」用 `magnitude`（Shreve），出口处等于源头条数。另外 D8 单流向在平坦区会产生大量 1–2 格的短河段（两个汇流点相邻），这是数据分辨率的问题不是 bug，提高阈值或先重采样能缓解。", "tip": "阈值就是「一条沟集水超过多少平方公里才算河」：常用 0.5–2 km²（1:5 万地形图约 1 km²）。`simplify_m` 给 5–15 m 可把栅格锯齿抹平，几何变干净、长度略短。产物里的 `downstream_reach` 就是拓扑表，可直接拿来建图或做洪水演进。", "keywords": "dem_path min_area_km2 river_threshold fill simplify_m out_dir", "py": "from dora.tools.terrain import ras_river_network\nimport json\nres = json.loads(ras_river_network(dem_path=\"dem.tif\"))", "json": "{\n  \"name\": \"ras.river_network\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\"\n  }\n}", "ex": {"inputs": ["同一块 900×900 子区（EPSG:32654，像元 12 m）；阈值 0.5 km² 汇水面积"], "in": "../examples/30-地形与地表变化/ras.river_network/in.webp", "img": "../examples/30-地形与地表变化/ras.river_network/out.webp", "cap": "102 条河段、共 110 km，最高 4 级；48 个汇流点、6 处水流出图", "note": "级数不是随便编号：两条一级支流汇成才升到二级，一条一级并入二级仍是二级——只有两条同级的汇合才会加一，所以数字跳得很慢，4 级已经代表整幅图的主干。magnitude 是另一个口径（Shreve）：数上游有几条源头，出口处为 54，更能反映「汇集了多少条沟」。注意右下方的方块：水从这里流出图幅，边界外的上游没算进来，级数只在图幅内成立。", "status": "real", "out": "{\n  \"tool\": \"ras.river_network\",\n  \"paths\": {\n    \"reaches\": \"<temp_dir>/river_network.geojson\",\n    \"nodes\": \"<temp_dir>/river_nodes.geojson\",\n    \"strahler\": \"<temp_dir>/river_strahler.tif\"\n  },\n  \"threshold\": {\n    \"cells\": 3462,\n    \"area_km2\": 0.5,\n    \"set_by\": \"min_area_km2\"\n  },\n  \"stats\": {\n    \"reaches\": 102,\n    \"junctions\": 48,\n    \"outlets\": 6,\n    \"headwaters\": 54,\n    \"max_strahler\": 4,\n    \"total_length_km\": 109.89,\n    \"river_cells\": 8051,\n    \"max_upstream_area_km2\": 100.95\n  },\n  \"by_order\": {\n    \"1\": {\n      \"reaches\": 54,\n      \"length_km\": 63.76\n    },\n    \"2\": {\n      \"reaches\": 26,\n      \"length_km\": 27.42\n    },\n    \"3\": {\n      \"reaches\": 14,\n      \"length_km\": 13.54\n    },\n    \"4\": {\n      \"reaches\": 8,\n      \"length_km\": 5.17\n    }\n  },\n  \"cell_size_m\": {\n    \"x\": 12.017180807112608,\n    \"y\": 12.017180807112608,\n    \"note\": null\n  },\n  \"shape\": [\n    900,\n    900\n  ],\n  \"warnings\": [\n    \"6 reaches leave the tile: the network is split by the tile edge (or by internal sinks), so orders are local to this DEM\"\n  ]\n}"}}, {"i": 82, "name": "ras.slope", "module": "analysis", "domain": "terrain", "relevance": "★★★", "transfer": "A", "desc_cn": "坡度是滑坡模型与汇流分析的基础因子", "desc_raw": "Compute a slope map in degrees from a DEM raster. Slope is derived via the Horn (1981) gradient formulation and converted from radians to degrees. Commonly used as input for landslide susceptibility and terrain stability.", "plain": "用高程数据算坡度，回答「哪里陡、哪里平」。滑坡易发区判定、水往哪儿流，都要从这里起步。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "units", "type": "str", "required": false, "default": "'degrees'", "desc": "单位：`degrees` 或 `percent`"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "slope_path", "type": "str", "desc": "Path to the generated slope raster"}, {"name": "units", "type": "str", "desc": "Units of the output values"}, {"name": "stats", "type": "dict", "desc": "min, max, mean slope"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "dem_path units out_path", "py": "from dora.tools.analysis import ras_slope\nimport json\nres = json.loads(ras_slope(dem_path=\"dem.tif\"))", "json": "{\n  \"name\": \"ras.slope\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\"\n  }\n}", "ex": {"inputs": ["ras.reproject 输出的 UTM DEM（米制像元 30 m）"], "in": "../examples/30-地形与地表变化/ras.slope/in.webp", "img": "../examples/30-地形与地表变化/ras.slope/out.webp", "cap": "上：输入高程；下：坡度（亮=陡，暗=平）", "note": "必须先投影到米制坐标系：直接喂经纬度 DEM，像元边长被当成 0.000129（度），坡度均值会算成 86°，不报错但全错。", "status": "real", "out": "{\n  \"tool\": \"ras.slope\",\n  \"slope_path\": \"<temp_dir>/slope.tif\",\n  \"units\": \"degrees\",\n  \"stats\": {\n    \"min\": 0.0,\n    \"max\": 88.26181030273438,\n    \"mean\": 19.227169036865234\n  }\n}"}}, {"i": 83, "name": "ras.terrain", "module": "terrain", "domain": "terrain", "relevance": "★★★", "transfer": "A", "desc_cn": "一次出坡度/坡向/曲率/TRI/TPI/粗糙度，地形地貌分析的地基", "desc_raw": "Derive terrain attributes from a DEM in one pass: slope, aspect, curvature, TRI, TPI and roughness. Uses the Horn 3x3 kernel (same as GDAL gdaldem) for slope and aspect, Zevenbergen-Thorne for curvature, Riley et al. for TRI, Weiss for TPI and a 3x3 range for roughness. A geographic CRS is handled b", "plain": "给一张高程图，一次算出六种地形指标：坡有多陡、朝哪个方向、坡面是凹是凸、比周围高还是低、地表有多破碎。滑坡易发性、日照、土壤水分、通行难度都从这几个量出发。和只算坡度的老工具相比，它不会在经纬度坐标上把「度」当成「米」用。", "dep": "numpy", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "attributes", "type": "str?", "required": false, "default": "None", "desc": "Comma-separated subset of slope,aspect,curvature,tri,tpi,roughness"}, {"name": "units", "type": "str", "required": false, "default": "'degrees'", "desc": "单位：`degrees` 或 `percent`"}, {"name": "out_dir", "type": "str?", "required": false, "default": "None", "desc": "Directory for the outputs; defaults to the session temp directory"}], "returns": [{"name": "paths", "type": "dict", "desc": "One GeoTIFF path per attribute"}, {"name": "stats", "type": "dict", "desc": "min / max / mean per attribute"}, {"name": "cell_size_m", "type": "dict", "desc": "Cell size actually used, and a note when the CRS was geographic"}], "boundary": "输入必须是**单波段高程**（米）。经纬度坐标会自动按纬度换算成米，但**投影变形仍在**——跨大范围做定量分析前应先投影到米制坐标系。边缘一行/列按复制填充，坡度会被削半，统计时建议去掉。", "pitfall": "曲率与 TPI 在平地上几乎全是 0，直接线性拉伸会糊成一片灰；出图时要做符号平方根拉伸，并用「零值偏暗」的发散色带。", "tip": "六个因子一次算完（2.87 M 像元约 3 s）；只要坡度时用 `ras.slope` 更省，但它不校正经纬度像元。", "keywords": "dem_path attributes units out_dir", "py": "from dora.tools.terrain import ras_terrain\nimport json\nres = json.loads(ras_terrain(dem_path=\"dem.tif\"))", "json": "{\n  \"name\": \"ras.terrain\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\"\n  }\n}", "ex": {"inputs": ["ras.reproject 输出的 UTM DEM（12 m 像元，日本山区整景）"], "in": "../examples/30-地形与地表变化/ras.terrain/in.webp", "img": "../examples/30-地形与地表变化/ras.terrain/out.webp", "cap": "上：输入高程；下：一次算出的 6 个地形因子", "note": "与 ras.slope 的关键差别：这里按米算，并在内部把经纬度的度换算成米；坡度用 Horn 3×3（同 GDAL gdaldem），曲率用 Zevenbergen–Thorne，TRI 用 Riley。", "status": "real", "out": "{\n  \"tool\": \"ras.terrain\",\n  \"paths\": {\n    \"slope\": \"<temp_dir>/terrain_slope.tif\",\n    \"aspect\": \"<temp_dir>/terrain_aspect.tif\",\n    \"curvature\": \"<temp_dir>/terrain_curvature.tif\",\n    \"tri\": \"<temp_dir>/terrain_tri.tif\",\n    \"tpi\": \"<temp_dir>/terrain_tpi.tif\",\n    \"roughness\": \"<temp_dir>/terrain_roughness.tif\"\n  },\n  \"stats\": {\n    \"slope\": {\n      \"min\": 0.0,\n      \"max\": 85.76124984176325,\n      \"mean\": 19.28970881783951\n    },\n    \"aspect\": {\n      \"min\": 0.0,\n      \"max\": 359.9507425512539,\n      \"mean\": 178.88502825822573\n    },\n    \"curvature\": {\n      \"min\": -220.82906115069125,\n      \"max\": 401.6926474215162,\n      \"mean\": -0.01631739309960443\n    },\n    \"tri\": {\n      \"min\": 0.0,\n      \"max\": 580.0949349384109,\n      \"mean\": 11.974823920195453\n    },\n    \"tpi\": {\n      \"min\": -98.59533283174659,\n      \"max\": 145.02373373460273,\n      \"mean\": -0.008788840453391173\n    },\n    \"roughness\": {\n      \"min\": 0.0,\n      \"max\": 297.04746746920546,\n      \"mean\": 11.556356158852871\n    }\n  },\n  \"units\": \"degrees\",\n  \"cell_size_m\": {\n    \"x\": 12.017180807112608,\n    \"y\": 12.017180807112608,\n    \"note\": null\n  },\n  \"shape\": [\n    1675,\n    1713\n  ]\n}"}}, {"i": 84, "name": "seg.landslide_bitemporal", "module": "perception", "domain": "terrain", "relevance": "★★★", "transfer": "B（未实测）", "desc_cn": "无 DEM 时的替代路径", "desc_raw": "Segment landslide from pre/post disaster optical satellite images (bi-temporal change detection). Spatial resolution: 0.59m.", "plain": "只靠灾前灾后两张普通影像找出滑坡，不需要高程数据，适合没有地形资料的地区。", "dep": "模型 SwinUperNet 6ch", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "pre_image_path", "type": "str", "required": true, "default": null, "desc": "灾前影像路径"}, {"name": "post_image_path", "type": "str", "required": true, "default": null, "desc": "灾后影像路径"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to the saved landslide mask image"}, {"name": "classes", "type": "dict", "desc": "Mapping of class values"}], "boundary": "0.59 m、双时相、3 波段，**不需要 DEM**——是没有 DEM 数据时的替代路径。精度未实测。", "pitfall": "", "tip": "", "keywords": "pre_image_path post_image_path", "py": "from dora.tools.perception import seg_landslide_bitemporal\nimport json\nres = json.loads(seg_landslide_bitemporal(pre_image_path=\"pre.tif\", post_image_path=\"post.tif\"))", "json": "{\n  \"name\": \"seg.landslide_bitemporal\",\n  \"arguments\": {\n    \"pre_image_path\": \"pre.tif\",\n    \"post_image_path\": \"post.tif\"\n  }\n}", "ex": {"inputs": ["xbd 灾前 / 灾后影像（0.8 m）——本例用建筑场景代替滑坡，只为演示接口"], "in": "", "img": "../examples/30-地形与地表变化/seg.landslide_bitemporal/out.webp", "cap": "影像｜双时相滑坡掩膜｜叠加", "note": "双时相模型看的是「两期差异」，与本场景语义不符时输出无意义；真实使用需 0.5–1 m 滑坡影像对。", "status": "demo", "out": "{\n  \"tool\": \"seg.landslide_bitemporal\",\n  \"mask_path\": \"<temp_dir>/seg_landslide_bitemporal_mask_5e08c1.png\",\n  \"classes\": {\n    \"0\": \"non-landslide\",\n    \"255\": \"landslide\"\n  },\n  \"_meta\": {\n    \"forward_ms\": 4029.96\n  }\n}"}}, {"i": 85, "name": "seg.landslide_ms", "module": "perception", "domain": "terrain", "relevance": "★★★", "transfer": "C（14 波段归一化）", "desc_cn": "地形地貌变化主力；必须 14 波段", "desc_raw": "Segment landslide from post-disaster multi-modal data: multi-spectral optical + DEM + slope. Spatial resolution: 10m. IMPORTANT: The input image MUST have exactly 14 bands (12-band multi-spectral + DEM: 1 band + Slope: 1 band). If your data has separate multi-spectral, DEM, and slope files, use ras.", "plain": "用多光谱加上高程、坡度，找出影像里哪些地方发生了滑坡。", "dep": "模型 WeTr 14ch", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "post_image_path", "type": "str", "required": true, "default": null, "desc": "灾后影像路径"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to the saved landslide mask image"}, {"name": "classes", "type": "dict", "desc": "Mapping of class values"}], "boundary": "域内 IoU 0.262（Landslide4Sense 就是它的训练域），**这是上界不是泛化**。10 m 输入、14 波段。", "pitfall": "波段数不对会**抛错**（这是好事）；但 DEM 与坡度对调不报错，只会悄悄变差。", "tip": "", "keywords": "post_image_path", "py": "from dora.tools.perception import seg_landslide_ms\nimport json\nres = json.loads(seg_landslide_ms(post_image_path=\"post.tif\"))", "json": "{\n  \"name\": \"seg.landslide_ms\",\n  \"arguments\": {\n    \"post_image_path\": \"post.tif\"\n  }\n}", "ex": {"inputs": ["14 波段影像（ras.concat 的产物，日本山区 1922×1384，10 m）"], "in": "../examples/30-地形与地表变化/seg.landslide_ms/in.webp", "img": "../examples/30-地形与地表变化/seg.landslide_ms/out.webp", "cap": "上：输入影像（假彩色拉伸）；下列：影像｜掩膜｜叠加（橙色为滑坡）", "note": "检出的是裸土/扰动像元，不含体积与危险性；10 m 下小于 30×30 m 的滑坡基本漏检。", "status": "real", "out": "{\n  \"tool\": \"seg.landslide_ms\",\n  \"mask_path\": \"<temp_dir>/seg_landslide_ms_mask_a825ef.tif\",\n  \"classes\": {\n    \"0\": \"non-landslide\",\n    \"255\": \"landslide\"\n  },\n  \"_meta\": {\n    \"forward_ms\": 3750.88\n  }\n}"}}, {"i": 86, "name": "seg.vegetation", "module": "perception", "domain": "terrain", "relevance": "★★★", "transfer": "B（仅单期）", "desc_cn": "旱情：植被覆盖变化、受旱耕地识别", "desc_raw": "Segment vegetation areas from single temporal optical satellite image. Detects trees, shrub and agriculture land. Spatial resolution: 0.5m-1.0m.", "plain": "认出一张影像里的林地、农田等植被覆盖区，用来比较植被是密了还是稀了。", "dep": "模型 DPT-landcover", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to binary vegetation mask (255 = vegetation)"}], "boundary": "**只做单期**。两期相减的平均面积变化 37.4%、一致率低至 0.63，会把模型漂移当成灾损变化。", "pitfall": "文档说取第 5/6 类，实际输出是 **0/255 二值掩膜**（`_binary_mask` 的合并结果），统计时按「>0」计数。", "tip": "", "keywords": "image_path", "py": "from dora.tools.perception import seg_vegetation\nimport json\nres = json.loads(seg_vegetation(image_path=\"input.tif\"))", "json": "{\n  \"name\": \"seg.vegetation\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\"\n  }\n}", "ex": {"inputs": ["xbd 灾后影像（3 波段，0–255）"], "in": "../examples/30-地形与地表变化/seg.vegetation/in.webp", "img": "../examples/30-地形与地表变化/seg.vegetation/out.webp", "cap": "影像｜植被掩膜｜叠加（文档说输出 5/6 类，实际是 0/255）", "note": "文档与实现不一致：工具返回 classes: {5, 6}，实际掩膜只有 0 和 255；统计请按 >0。", "status": "real", "out": "{\n  \"tool\": \"seg.vegetation\",\n  \"mask_path\": \"<temp_dir>/vegetation_map_586cfc.png\",\n  \"classes\": {\n    \"5\": \"forest\",\n    \"6\": \"agriculture\"\n  },\n  \"mask_value\": 255,\n  \"_meta\": {\n    \"forward_ms\": 17570.07\n  }\n}"}}, {"i": 87, "name": "vec.buffer", "module": "analysis", "domain": "vector", "relevance": "★★★", "transfer": "A", "desc_cn": "河道缓冲带、溃堤影响带、河岸带", "desc_raw": "Create a buffer around all geometries in a vector file. The distance is interpreted in the CRS units (meters if CRS is metric).", "plain": "沿着一条线或一个点，向外画出一圈指定宽度的影响带。溃堤口 500 米内、河道两侧 100 米，都是这么圈出来的。", "dep": "geo", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "meter", "type": "float", "required": true, "default": null, "desc": "Buffer distance"}], "returns": [{"name": "buffer_path", "type": "str", "desc": "Path to buffered GeoJSON"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path meter", "py": "from dora.tools.analysis import vec_buffer\nimport json\nres = json.loads(vec_buffer(vector_path=\"admin.geojson\", meter=\"0.0\"))", "json": "{\n  \"name\": \"vec.buffer\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\",\n    \"meter\": \"0.0\"\n  }\n}", "ex": {"inputs": ["images/heatisland/09LD1638/osm/bui ds_single.geojson\"\n}"}}, {"i": 89, "name": "vec.centroid", "module": "analysis", "domain": "vector", "relevance": "★★", "transfer": "A", "desc_cn": "灾情中心点", "desc_raw": "Calculate the centroid of a polygon or point feature in a vector file. Useful for finding the center point of the largest damaged area (explosion center).", "plain": "算每个图斑的中心点，用来标注「灾情中心在哪」。", "dep": "geo", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "feature_idx", "type": "int", "required": false, "default": "0", "desc": "Index of feature to get centroid for (default: 0, the first feature; use -1 for the largest)"}, {"name": "raster_path", "type": "str", "required": false, "default": "None", "desc": "栅格路径"}], "returns": [{"name": "feature_idx", "type": "int", "desc": "The feature index used"}, {"name": "geometry_type", "type": "str", "desc": "Type of the original geometry"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path feature_idx raster_path", "py": "from dora.tools.analysis import vec_centroid_tool\nimport json\nres = json.loads(vec_centroid_tool(vector_path=\"admin.geojson\"))", "json": "{\n  \"name\": \"vec.centroid\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\"\n  }\n}", "ex": {"inputs": ["images/heatisland/09LD1638/osm/buildings.geojson（79 个建筑面，已转 EPSG:6677）"], "in": "", "img": "", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"vec.centroid\",\n  \"feature_idx\": 0,\n  \"geometry_type\": \"Polygon\",\n  \"latitude\": 35.69177906203053,\n  \"longitude\": 139.69547570982024\n}"}}, {"i": 90, "name": "vec.clip", "module": "analysis", "domain": "vector", "relevance": "★★", "transfer": "A", "desc_cn": "裁到流域/行政区边界", "desc_raw": "Clip input vectors by ROI vectors.", "plain": "用一块多边形去裁矢量数据，只保留范围内的部分。", "dep": "geo", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "par  of polygons/components"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path", "py": "from dora.tools.analysis import vec_connected_components\nimport json\nres = json.loads(vec_connected_components(vector_path=\"admin.geojson\"))", "json": "{\n  \"name\": \"vec.connected_components\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\"\n  }\n}", "ex": {"inputs": ["images/heatisland/09LD1638/osm/buildings.geojson（79 个建筑面，已转 EPSG:6677）"], "in": "", "img": "", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"vec.connected_components\",\n  \"count\": 79,\n  \"vector_path\": \"<work>/fixtures/buildings.geojson\",\n  \"mode\": \"vector\"\n}"}}, {"i": 92, "name": "vec.convex_hull", "module": "analysis", "domain": "vector", "relevance": "★★", "transfer": "A", "desc_cn": "灾害影响范围包络", "desc_raw": "Compute the convex hull of a set of polygons or points in a GeoJSON file. Useful for estimating the spatial envelope of a damage cluster or hazard spread footprint.", "plain": "把一堆点或面用最小的凸多边形包起来，快速得到「大致影响范围」。", "dep": "geo", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to convex hull GeoJSON"}, {"name": "area_m2", "type": "float", "desc": "Area of the hull (if CRS is projected)"}, {"name": "vertex_count", "type": "int", "desc": "Number of vertices in the hull"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path out_path", "py": "from dora.tools.analysis import vec_convex_hull\nimport json\nres = json.loads(vec_convex_hull(vector_path=\"admin.geojson\"))", "json": "{\n  \"name\": \"vec.convex_hull\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\"\n  }\n}", "ex": {"inputs": ["images/heatisland/09LD1638/osm/buildings.geojson（79 个建筑面，已转 EPSG:6677）"], "in": "../examples/50-矢量与空间关系/vec.convex_hull/in.webp", "img": "../examples/50-矢量与空间关系/vec.convex_hull/out.webp", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"vec.convex_hull\",\n  \"output_path\": \"<temp_dir>/convex_hull.geojson\",\n  \"area_m2\": 115435.29787072193,\n  \"vertex_count\": 19\n}"}}, {"i": 93, "name": "vec.dissolve", "module": "analysis", "domain": "vector", "relevance": "★★★", "transfer": "A", "desc_cn": "把破碎淹没斑块合成连片淹没区", "desc_raw": "Dissolve (merge) overlapping or adjacent polygons into larger ones, optionally grouping by an attribute field. Useful for consolidating fragmented damage patches into contiguous impact zones.", "plain": "把挨在一起的碎块合并成整片。淹没区原本是几十个小斑块，合并后才是「一片洪区」。", "dep": "geo", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "by", "type": "str?", "required": false, "default": "None", "desc": "Attribute field to group by before dissolving"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to dissolved GeoJSON"}, {"name": "input_count", "type": "int", "desc": "Number of input features"}, {"name": "output_count", "type": "int", "desc": "Number of features after dissolve"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path by out_path", "py": "from dora.tools.analysis import vec_dissolve\nimport json\nres = json.loads(vec_dissolve(vector_path=\"admin.geojson\"))", "json": "{\n  \"name\": \"vec.dissolve\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\"\n  }\n}", "ex": {"inputs": ["images/heatisland/09LD1638/osm/buildings.geojson（79 个建筑面，已转 EPSG:6677）"], "in": "../examples/50-矢量与空间关系/vec.dissolve/in.webp", "img": "../examples/50-矢量与空间关系/vec.dissolve/out.webp", "cap": "", "note": "", "status": "real", "out": "{\n  \"tool\": \"vec.diss
