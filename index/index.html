ounds are filtered out. The output GeoJSON contains the original properties plus pixel coordinates (pixel_row, pixel_col, utm_x, utm_y).", "plain": "把经纬度换算成影像上的行列号，让业务点位和卫星图对齐。", "dep": "geo+rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "geojson_path", "type": "str", "required": true, "default": null, "desc": "GeoJSON 文件路径"}, {"name": "raster_path", "type": "str", "required": true, "default": null, "desc": "栅格路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to transformed GeoJSON"}, {"name": "total_points", "type": "int", "desc": "Total input POI count"}, {"name": "valid_points", "type": "int", "desc": "Number of POIs within image bounds"}, {"name": "filtered_points", "type": "int", "desc": "Number of POIs filtered out (outside image)"}, {"name": "image_bounds", "type": "dict", "desc": "Image bounds (left, right, bottom, top)"}, {"name": "image_size", "type": "list", "desc": "[width, height] of the reference image"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "geojson_path raster_path", "py": "from dora.tools.poi import poi_world_to_pixel_tool\nimport json\nres = json.loads(poi_world_to_pixel_tool(geojson_path=\"admin.geojson\", raster_path=\"input.tif\"))", "json": "{\n  \"name\": \"poi.world_to_pixel\",\n  \"arguments\": {\n    \"geojson_path\": \"admin.geojson\",\n    \"raster_path\": \"input.tif\"\n  }\n}"}, {"i": 61, "name": "mask.compose_multiclass", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "把「常水体/新增水体/退水」合成一张图", "desc_raw": "Compose multiple binary masks into a single multiclass raster mask. Each input mask contributes one class value, and any positive pixel in a mask is assigned to that class in the output raster.", "plain": "把几张黑白范围图合成一张分色的图。比如把「常年有水」「新增淹没」「退水后露出的滩地」各给一种颜色，合成一张便于区分。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "mask_paths", "type" ", pixel_size_m=\"0.0\"))", "json": "{\n  \"name\": \"ras.area\",\n  \"arguments\": {\n    \"mask_path\": \"mask.png\",\n    \"pixel_size_m\": \"0.0\"\n  }\n}"}, {"i": 63, "name": "ras.clip", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "按流域/行政区裁切", "desc_raw": "Clip a raster by a pixel window [x1:x2, y1:y2], where x is row (top→bottom) and y is column (left→right). Preserves georeferencing if the input has it (GeoTIFF/COG/etc.).", "plain": "按一块矩形范围裁图，只留下关心的那一块，后面的计算就不用管全图。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "x1", "type": "int", "required": true, "default": null, "desc": "右下角列号"}, {"name": "x2", "type": "int", "required": true, "default": null, "desc": ""}, {"name": "y1", "type": "int", "required": true, "default": null, "desc": "右下角行号"}, {"name": "y2", "type": "int", "required": true, "default": null, "desc": ""}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to clipped raster in TEMP_DIR"}, {"name": "window", "type": "dict", "desc": "{x1, x2, y1, y2} actually used"}, {"name": "out_shape", "type": "list[int,int", "desc": "[height, width]"}, {"name": "clamped", "type": "bool", "desc": "whether input window was clamped to image bounds"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path x1 x2 y1 y2", "py": "from dora.tools.analysis import ras_clip\nimport json\nres = json.loads(ras_clip(image_path=\"input.tif\", x1=\"1\", x2=\"1\", y1=\"1\", y2=\"1\"))", "json": "{\n  \"name\": \"ras.clip\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"x1\": \"1\",\n    \"x2\": \"1\",\n    \"y1\": \"1\",\n    \"y2\": \"1\"\n  }\n}"}, {"i": 64, "name": "ras.concat", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "构造 14 波段输入（多光谱 + DEM + 坡度）的必经步骤", "desc_raw": "Concatenate multiple rasters along the band/channel dimension into a single GeoTIFF. All inputs must have identical height/width and, if present, the same CRS and transform.", "plain": "把几张不同来源的图按波段叠成一张多层图。有些模型要求一次吃十几个波段（可见光 + 高程 + 坡度），只能靠它拼出来。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path_list", "type": "list[str]", "required": true, "default": null, "desc": "list of raster paths (GeoTIFF/COG/…)"}, {"name": "dim", "type": "str", "required": false, "default": "'bands'", "desc": "only \"bands\" or \"channels\" is supported for now"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to the concatenated GeoTIFF in TEMP_DIR"}, {"name": "bands", "type": "int", "desc": "total bands in the output"}, {"name": "band_map", "type": "list[dict", "desc": "[{path, in_bands, out_start_band, out_end_band}]"}], "boundary": "", "pitfall": "", "tip": "构造 14 波段输入的**唯一途径**。顺序必须是 B1–B12、坡度、DEM，错序不报错但结果偏移。", "keywords": "image_path_list dim", "py": "from dora.tools.analysis import ras_concat\nimport json\nres = json.loads(ras_concat(image_path_list=\"input.tif\"))", "json": "{\n  \"name\": \"ras.concat\",\n  \"arguments\": {\n    \"image_path_list\": \"input.tif\"\n  }\n}"}, {"i": 65, "name": "ras.count_pixels", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "面积前的中间量", "desc_raw": "Count pixels for specified classes in a mask image.", "plain": "数一数某类区域占了多少个像素。面积就是它乘上每个像素代表的平方米数。", "dep": "numpy", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "mask_path", "type": "str", "required": true, "default": null, "desc": "掩膜路径（二值或多类）"}, {"name": "classes", "type": "list[int]", "required": true, "default": null, "desc": "要保留的类别值列表"}], "returns": [{"name": "counts", "type": "dict", "desc": "Pixel counts per class"}, {"name": "total", "type": "int", "desc": "Total pixel count for all specified classes"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "mask_path classes", "py": "from dora.tools.analysis import ras_count_pixels\nimport json\nres = json.loads(ras_count_pixels(mask_path=\"mask.png\", classes=\"input.tif\"))", "json": "{\n  \"name\": \"ras.count_pixels\",\n  \"arguments\": {\n    \"mask_path\": \"mask.png\",\n    \"classes\": \"input.tif\"\n  }\n}"}, {"i": 66, "name": "ras.diff", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "多期差值、DSM−DEM 求相对高度", "desc_raw": "Subtract raster B from raster A band by band and save the difference raster. Useful for deriving relative height such as DSM - DEM.", "plain": "把两张同一位置的图逐点相减，得到变化量。两期高程相减就是填挖或淤积的厚度，两期影像相减就是地表变没变。它只会减，不会除。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_a_path", "type": "str", "required": true, "default": null, "desc": "栅格 A 路径"}, {"name": "image_b_path", "type": "str", "required": true, "default": null, "desc": "栅格 B 路径"}, {"name": "band_a", "type": "int", "required": false, "default": "1", "desc": "A 使用的波段号"}, {"name": "band_b", "type": "int", "required": false, "default": "1", "desc": "B 使用的波段号"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to the difference raster in TEMP_DIR"}, {"name": "min", "type": "float|None", "desc": "Minimum valid difference"}, {"name": "max", "type": "float|None", "desc": "Maximum valid difference"}, {"name": "mean", "type": "float|None", "desc": "Mean valid difference"}, {"name": "valid_pixels", "type": "int", "desc": "Number of valid pixels used"}], "boundary": "", "pitfall": "", "tip": "只做 A − B 的逐像元相减，**不能除**——所以算不了任何指数。DSM − DEM 求相对高度也用它。", "keywords": "image_a_path image_b_path band_a band_b", "py": "from dora.tools.analysis import ras_diff\nimport json\nres = json.loads(ras_diff(image_a_path=\"input.tif\", image_b_path=\"input.tif\"))", "json": "{\n  \"name\": \"ras.diff\",\n  \"arguments\": {\n    \"image_a_path\": \"input.tif\",\n    \"image_b_path\": \"input.tif\"\n  }\n}"}, {"i": 67, "name": "ras.focal_stats", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "热点检测、平滑、DEM 局部粗糙度", "desc_raw": "Compute focal (moving-window) statistics over a raster. For each pixel, aggregate the values inside a square window of side `window_size` centred on the pixel (odd window sizes recommended). Typical uses: smooth a damage density map, detect local hotspots, extract local roughness from a DEM, or pre-", "plain": "对每个像素看它周围一圈邻居，算平均、最大或波动有多大。用来平滑噪点，或找出「比周围明显异常」的点。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "raster_path", "type": "str", "required": true, "default": null, "desc": "栅格路径"}, {"name": "statistic", "type": "str", "required": false, "default": "'mean'", "desc": "统计量：mean / max / min / std / median"}, {"name": "window_size", "type": "int", "required": false, "default": "5", "desc": "邻域窗口边长（像元）"}, {"name": "nodata", "type": "float?", "required": false, "default": "None", "desc": "Value to treat as nodata. Defaults to the"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [], "boundary": "", "pitfall": "", "tip": "", "keywords": "raster_path statistic window_size nodata out_path", "py": "from dora.tools.analysis import ras_focal_stats\nimport json\nres = json.loads(ras_focal_stats(raster_path=\"input.tif\"))", "json": "{\n  \"name\": \"ras.focal_stats\",\n  \"arguments\": {\n    \"raster_path\": \"input.tif\"\n  }\n}"}, {"i": 68, "name": "ras.grid_windows", "module": "calculate", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "面雨量/旱情分区统计的基础", "desc_raw": "Split a raster image into a uniform n×n grid and return pixel windows. Indexing uses image[x1:x2, y1:y2] where x is row (top→bottom), y is column (left→right). If H or W is not divisible by n, the last row/col expands to the image boundary.", "plain": "把一张图切成 n×n 的小格，方便一格一格统计。找「最热的街区」「最旱的片区」，就是先切格再排序。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "n", "type": "int", "required": true, "default": null, "desc": "数量或网格边长"}], "returns": [{"name": "windows", "type": "list[list[int", "desc": "[[x1,x2,y1,y2], ...] in row-major order"}, {"name": "image_shape", "type": "list[int", "desc": "[height, width]"}, {"name": "base_tile_px", "type": "list[int", "desc": "[floor(H/n), floor(W/n)]"}, {"name": "count", "type": "int", "desc": "n*n"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path n", "py": "from dora.tools.calculate import ras_grid_windows\nimport json\nres = json.loads(ras_grid_windows(image_path=\"input.tif\", n=\"1\"))", "json": "{\n  \"name\": \"ras.grid_windows\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"n\": \"1\"\n  }\n}"}, {"i": 69, "name": "ras.reproject", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "多源数据统一坐标系（国产影像常为 CGCS2000）", "desc_raw": "Reproject a raster from its current CRS to a target CRS. Useful for aligning multi-source data (e.g., optical + SAR, DEM + damage mask) so downstream operations can be performed in a common coordinate system.", "plain": "把影像换到统一的坐标系。国产数据常是 CGCS2000、国际数据多是 WGS84，不统一就没法叠在一张图上。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "raster_path", "type": "str", "required": true, "default": null, "desc": "栅格路径"}, {"name": "dst_crs", "type": "str", "required": true, "default": null, "desc": "Target CRS as an EPSG code (e.g., \"EPSG:32636\")"}, {"name": "resampling", "type": "str", "required": false, "default": "'bilinear'", "desc": "重采样方法：nearest / bilinear / cubic"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to the reprojected raster"}, {"name": "src_crs", "type": "str", "desc": "Original CRS"}, {"name": "dst_crs", "type": "str", "desc": "New CRS"}, {"name": "shape", "type": "list[int", "desc": "[height, width]"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "raster_path dst_crs resampling out_path", "py": "from dora.tools.analysis import ras_reproject\nimport json\nres = json.loads(ras_reproject(raster_path=\"input.tif\", dst_crs=\"\"input.tif\"\"))", "json": "{\n  \"name\": \"ras.reproject\",\n  \"arguments\": {\n    \"raster_path\": \"input.tif\",\n    \"dst_crs\": \"\\\"input.tif\\\"\"\n  }\n}"}, {"i": 70, "name": "ras.resample", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "统一 GSD：模型对分辨率敏感，这一步不能省", "desc_raw": "Resample a raster to a new pixel size. Useful for harmonizing resolution between multi-source data (e.g., resampling a coarser grid to a finer target resolution).", "plain": "把影像缩放到指定分辨率。模型对「一像素代表多少米」很敏感，喂进去之前基本都要这一步。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "raster_path", "type": "str", "required": true, "default": null, "desc": "栅格路径"}, {"name": "target_pixel_size_m", "type": "float", "required": true, "default": null, "desc": "Desired pixel size in meters"}, {"name": "resampling", "type": "str", "required": false, "default": "'bilinear'", "desc": "重采样方法：nearest / bilinear / cubic"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to the resampled raster"}, {"name": "src_pixel_size_m", "type": "float", "desc": "Original pixel size"}, {"name": "dst_pixel_size_m", "type": "float", "desc": "New pixel size"}, {"name": "shape", "type": "list[int", "desc": "[height, width]"}], "boundary": "", "pitfall": "", "tip": "模型对分辨率敏感，接入前这一步不能省。降采样只改像素，不改类别语义——3.2 m 时「部分损毁」会塌得比「完全损毁」更快。", "keywords": "raster_path target_pixel_size_m resampling out_path", "py": "from dora.tools.analysis import ras_resample\nimport json\nres = json.loads(ras_resample(raster_path=\"input.tif\", target_pixel_size_m=\"0.0\"))", "json": "{\n  \"name\": \"ras.resample\",\n  \"arguments\": {\n    \"raster_path\": \"input.tif\",\n    \"target_pixel_size_m\": \"0.0\"\n  }\n}"}, {"i": 71, "name": "ras.sample_point", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "站点/断面取值", "desc_raw": "Sample pixel value at a specific (row, col) location in a raster image.", "plain": "给一个坐标，返回那里图上的数值。想查某个水文站、某个村口的水深或温度，就用它。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "row", "type": "int", "required": true, "default": null, "desc": "Pixel row (y coordinate)"}, {"name": "col", "type": "int", "required": true, "default": null, "desc": "Pixel column (x coordinate)"}], "returns": [{"name": "row", "type": "int", "desc": "Input row coordinate"}, {"name": "col", "type": "int", "desc": "Input column coordinate"}, {"name": "pixel_values", "type": "dict", "desc": "Pixel value for each band (1-indexed)"}, {"name": "is_inside", "type": "bool", "desc": "Whether the coordinates are within image bounds"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path row col", "py": "from dora.tools.analysis import ras_sample_point_tool\nimport json\nres = json.loads(ras_sample_point_tool(image_path=\"input.tif\", row=\"1\", col=\"1\"))", "json": "{\n  \"name\": \"ras.sample_point\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"row\": \"1\",\n    \"col\": \"1\"\n  }\n}"}, {"i": 72, "name": "ras.sample_points", "module": "analysis", "domain": "raster", "relevance": "★★", "transfer": "A", "desc_cn": "水文站点批量采样", "desc_raw": "Sample pixel values at multiple locations in a raster image.", "plain": "一次查很多个点，返回一张表。适合把几十上百个站点的值一次取出来。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "points", "type": "list[dict]", "required": true, "default": null, "desc": "点要素列表"}], "returns": [{"name": "total_points", "type": "int", "desc": "Number of input points"}, {"name": "results", "type": "list", "desc": "List of {row, col, pixel_values, is_inside} for each point"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path points", "py": "from dora.tools.analysis import ras_sample_points_tool\nimport json\nres = json.loads(ras_sample_points_tool(image_path=\"input.tif\", points=\"input.tif\"))", "json": "{\n  \"name\": \"ras.sample_points\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"points\": \"input.tif\"\n  }\n}"}, {"i": 73, "name": "ras.stats", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "水位/温度/降水量的区域统计", "desc_raw": "Compute summary statistics for one raster band while ignoring nodata values.", "plain": "给一张图算几个基本数字：最小、最大、平均、以及起伏有多大。用来快速判断这片区域整体什么情况，比如全县平均降雨、平均地表温度。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "band", "type": "int", "required": false, "default": "1", "desc": "波段号，从 1 开始"}, {"name": "ignore_nodata", "type": "bool", "required": false, "default": "True", "desc": "Ignore nodata and NaN values. Default is true"}], "returns": [{"name": "min", "type": "float|None", "desc": "Minimum valid value"}, {"name": "max", "type": "float|None", "desc": "Maximum valid value"}, {"name": "mean", "type": "float|None", "desc": "Mean valid value"}, {"name": "std", "type": "float|None", "desc": "Standard deviation of valid values"}, {"name": "valid_pixels", "type": "int", "desc": "Number of valid pixels used"}, {"name": "band", "type": "int", "desc": "Band index used"}, {"name": "nodata", "type": "float|None", "desc": "Raster nodata value"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "image_path band ignore_nodata", "py": "from dora.tools.analysis import ras_stats\nimport json\nres = json.loads(ras_stats(image_path=\"input.tif\"))", "json": "{\n  \"name\": \"ras.stats\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\"\n  }\n}"}, {"i": 74, "name": "ras.threshold", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "最通用的一招：LST/NDVI/水深/降水栅格都能阈值化", "desc_raw": "Create a binary mask by thresholding one raster band.", "plain": "把一张图里符合某个数值条件的区域涂白、其余涂黑。比如只保留温度高于 35 度的地方，或者只保留水深超过 0.5 米的地方——一次就能圈出范围，不用另训模型。", "dep": "rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}, {"name": "threshold", "type": "float", "required": true, "default": null, "desc": "阈值"}, {"name": "op", "type": "str", "required": false, "default": "'>='", "desc": "比较运算符：`>=` `>` `<=` `<` `==`"}, {"name": "band", "type": "int", "required": false, "default": "1", "desc": "波段号，从 1 开始"}, {"name": "true_value", "type": "int", "required": false, "default": "255", "desc": "命中像元写入的值"}, {"name": "false_value", "type": "int", "required": false, "default": "0", "desc": "未命中像元写入的值"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to threshold mask in TEMP_DIR"}, {"name": "selected_pixels", "type": "int", "desc": "Number of pixels passing the threshold"}, {"name": "threshold", "type": "float", "desc": "Input threshold"}, {"name": "op", "type": "str", "desc": "Comparison operator used"}], "boundary": "只做单波段二值化，不能做波段比值（算不了 NDVI/NDWI，那是缺口）。", "pitfall": "", "tip": "SAR 水体最实用的下限基线：VV < −16 dB 得 IoU 0.267，零权重、801 次调用零报错。任何新模型要先超过它。", "keywords": "image_path threshold op band true_value false_value", "py": "from dora.tools.analysis import ras_threshold\nimport json\nres = json.loads(ras_threshold(image_path=\"input.tif\", threshold=\"0.0\"))", "json": "{\n  \"name\": \"ras.threshold\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\",\n    \"threshold\": \"0.0\"\n  }\n}"}, {"i": 75, "name": "ras.vectorize", "module": "analysis", "domain": "raster", "relevance": "★★★", "transfer": "A", "desc_cn": "淹没范围出图、与行政区叠加的前提", "desc_raw": "Vectorize a raster mask to extract polygons for specified classes. Converts pixel-based mask to vector polygons with area statistics and saves GeoJSON. This tool facilitates the later vector-based processing.", "plain": "把黑白的范围图转成 GIS 里能编辑、能叠加的面数据，每一块还自带面积。要在行政区上算数、要出彩色范围图，都得先走这一步。", "dep": "rasterio+geo", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "mask_path", "type": "str", "required": true, "default": null, "desc": "掩膜路径（二值或多类）"}, {"name": "classes", "type": "list[int]", "required": true, "default": null, "desc": "要保留的类别值列表"}, {"name": "pixel_size_m", "type": "float", "required": false, "default": "None", "desc": "像元边长（米）。掩膜无地理参考时必须显式给出"}], "returns": [{"name": "vector_path", "type": "str", "desc": "Path to the saved vector GeoJSON"}, {"name": "polygons", "type": "list", "desc": "List of polygon properties (id/class/pixel_count/area_m2)"}, {"name": "count", "type": "int", "desc": "Number of polygons extracted"}, {"name": "total_pixels", "type": "int", "desc": "Total pixel count for the classes"}, {"name": "total_area_m2", "type": "float|None", "desc": "Total area in m2 if pixel_size_m provided"}], "boundary": "", "pitfall": "", "tip": "输出多边形自带 `area_m2`；碎斑用 `vec.filter_by_area` 清，再 `vec.intersect` 叠行政区。", "keywords": "mask_path classes pixel_size_m", "py": "from dora.tools.analysis import ras_vectorize\nimport json\nres = json.loads(ras_vectorize(mask_path=\"mask.png\", classes=\"input.tif\"))", "json": "{\n  \"name\": \"ras.vectorize\",\n  \"arguments\": {\n    \"mask_path\": \"mask.png\",\n    \"classes\": \"input.tif\"\n  }\n}"}, {"i": 76, "name": "ras.hillshade", "module": "analysis", "domain": "terrain", "relevance": "★★★", "transfer": "A", "desc_cn": "地形地貌可视化、滑坡/泥石流易发性底图", "desc_raw": "Compute a hillshade image from a Digital Elevation Model (DEM) raster, revealing terrain relief. Uses the standard Horn (1981) formulation with configurable sun azimuth and altitude angles. Useful for landslide and debris-flow susceptibility mapping.", "plain": "用高程数据做出一张带光影的地形图，山脊、沟谷一眼能看出来，常拿来当底图。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "azimuth", "type": "float", "required": false, "default": "315.0", "desc": "光源方位角（度）"}, {"name": "altitude", "type": "float", "required": false, "default": "45.0", "desc": "光源高度角（度）"}, {"name": "z_factor", "type": "float", "required": false, "default": "1.0", "desc": "高程夸张系数"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "hillshade_path", "type": "str", "desc": "Path to the generated hillshade image"}, {"name": "shape", "type": "list[int", "desc": "[height, width] of the output"}, {"name": "stats", "type": "dict", "desc": "min, max, mean of hillshade values (0-255)"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "dem_path azimuth altitude z_factor out_path", "py": "from dora.tools.analysis import ras_hillshade\nimport json\nres = json.loads(ras_hillshade(dem_path=\"dem.tif\"))", "json": "{\n  \"name\": \"ras.hillshade\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\"\n  }\n}"}, {"i": 77, "name": "ras.slope", "module": "analysis", "domain": "terrain", "relevance": "★★★", "transfer": "A", "desc_cn": "坡度是滑坡模型与汇流分析的基础因子", "desc_raw": "Compute a slope map in degrees from a DEM raster. Slope is derived via the Horn (1981) gradient formulation and converted from radians to degrees. Commonly used as input for landslide susceptibility and terrain stability.", "plain": "用高程数据算坡度，回答「哪里陡、哪里平」。滑坡易发区判定、水往哪儿流，都要从这里起步。", "dep": "rasterio", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "dem_path", "type": "str", "required": true, "default": null, "desc": "DEM 路径"}, {"name": "units", "type": "str", "required": false, "default": "'degrees'", "desc": "单位：`degrees` 或 `percent`"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "slope_path", "type": "str", "desc": "Path to the generated slope raster"}, {"name": "units", "type": "str", "desc": "Units of the output values"}, {"name": "stats", "type": "dict", "desc": "min, max, mean slope"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "dem_path units out_path", "py": "from dora.tools.analysis import ras_slope\nimport json\nres = json.loads(ras_slope(dem_path=\"dem.tif\"))", "json": "{\n  \"name\": \"ras.slope\",\n  \"arguments\": {\n    \"dem_path\": \"dem.tif\"\n  }\n}"}, {"i": 78, "name": "seg.landslide_bitemporal", "module": "perception", "domain": "terrain", "relevance": "★★★", "transfer": "B（未实测）", "desc_cn": "无 DEM 时的替代路径", "desc_raw": "Segment landslide from pre/post disaster optical satellite images (bi-temporal change detection). Spatial resolution: 0.59m.", "plain": "只靠灾前灾后两张普通影像找出滑坡，不需要高程数据，适合没有地形资料的地区。", "dep": "模型 SwinUperNet 6ch", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "pre_image_path", "type": "str", "required": true, "default": null, "desc": "灾前影像路径"}, {"name": "post_image_path", "type": "str", "required": true, "default": null, "desc": "灾后影像路径"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to the saved landslide mask image"}, {"name": "classes", "type": "dict", "desc": "Mapping of class values"}], "boundary": "0.59 m、双时相、3 波段，**不需要 DEM**——是没有 DEM 数据时的替代路径。精度未实测。", "pitfall": "", "tip": "", "keywords": "pre_image_path post_image_path", "py": "from dora.tools.perception import seg_landslide_bitemporal\nimport json\nres = json.loads(seg_landslide_bitemporal(pre_image_path=\"pre.tif\", post_image_path=\"post.tif\"))", "json": "{\n  \"name\": \"seg.landslide_bitemporal\",\n  \"arguments\": {\n    \"pre_image_path\": \"pre.tif\",\n    \"post_image_path\": \"post.tif\"\n  }\n}"}, {"i": 79, "name": "seg.landslide_ms", "module": "perception", "domain": "terrain", "relevance": "★★★", "transfer": "C（14 波段归一化）", "desc_cn": "地形地貌变化主力；必须 14 波段", "desc_raw": "Segment landslide from post-disaster multi-modal data: multi-spectral optical + DEM + slope. Spatial resolution: 10m. IMPORTANT: The input image MUST have exactly 14 bands (12-band multi-spectral + DEM: 1 band + Slope: 1 band). If your data has separate multi-spectral, DEM, and slope files, use ras.", "plain": "用多光谱加上高程、坡度，找出影像里哪些地方发生了滑坡。", "dep": "模型 WeTr 14ch", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "post_image_path", "type": "str", "required": true, "default": null, "desc": "灾后影像路径"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to the saved landslide mask image"}, {"name": "classes", "type": "dict", "desc": "Mapping of class values"}], "boundary": "域内 IoU 0.262（Landslide4Sense 就是它的训练域），**这是上界不是泛化**。10 m 输入、14 波段。", "pitfall": "波段数不对会**抛错**（这是好事）；但 DEM 与坡度对调不报错，只会悄悄变差。", "tip": "", "keywords": "post_image_path", "py": "from dora.tools.perception import seg_landslide_ms\nimport json\nres = json.loads(seg_landslide_ms(post_image_path=\"post.tif\"))", "json": "{\n  \"name\": \"seg.landslide_ms\",\n  \"arguments\": {\n    \"post_image_path\": \"post.tif\"\n  }\n}"}, {"i": 80, "name": "seg.vegetation", "module": "perception", "domain": "terrain", "relevance": "★★★", "transfer": "B（仅单期）", "desc_cn": "旱情：植被覆盖变化、受旱耕地识别", "desc_raw": "Segment vegetation areas from single temporal optical satellite image. Detects trees, shrub and agriculture land. Spatial resolution: 0.5m-1.0m.", "plain": "认出一张影像里的林地、农田等植被覆盖区，用来比较植被是密了还是稀了。", "dep": "模型 DPT-landcover", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "image_path", "type": "str", "required": true, "default": null, "desc": "输入栅格路径（GeoTIFF / PNG；PNG 无地理参考）"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to binary vegetation mask (255 = vegetation)"}], "boundary": "**只做单期**。两期相减的平均面积变化 37.4%、一致率低至 0.63，会把模型漂移当成灾损变化。", "pitfall": "文档说取第 5/6 类，实际输出是 **0/255 二值掩膜**（`_binary_mask` 的合并结果），统计时按「>0」计数。", "tip": "", "keywords": "image_path", "py": "from dora.tools.perception import seg_vegetation\nimport json\nres = json.loads(seg_vegetation(image_path=\"input.tif\"))", "json": "{\n  \"name\": \"seg.vegetation\",\n  \"arguments\": {\n    \"image_path\": \"input.tif\"\n  }\n}"}, {"i": 81, "name": "vec.buffer", "module": "analysis", "domain": "vector", "relevance": "★★★", "transfer": "A", "desc_cn": "河道缓冲带、溃堤影响带、河岸带", "desc_raw": "Create a buffer around all geometries in a vector file. The distance is interpreted in the CRS units (meters if CRS is metric).", "plain": "沿着一条线或一个点，向外画出一圈指定宽度的影响带。溃堤口 500 米内、河道两侧 100 米，都是这么圈出来的。", "dep": "geo", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "meter", "type": "float", "required": true, "default": null, "desc": "Buffer distance"}], "returns": [{"name": "buffer_path", "type": "str", "desc": "Path to buffered GeoJSON"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path meter", "py": "from dora.tools.analysis import vec_buffer\nimport json\nres = json.loads(vec_buffer(vector_path=\"admin.geojson\", meter=\"0.0\"))", "json": "{\n  \"name\": \"vec.buffer\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\",\n    \"meter\": \"0.0\"\n  }\n}"}, {"i": 82, "name": "vec.build_graph", "module": "analysis", "d ue, "default": null, "desc": "矢量路径（GeoJSON）"}], "returns": [{"name": "count", "type": "int", "desc": "Number of polygons/components"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path", "py": "from dora.tools.analysis import vec_connected_components\nimport json\nres = json.loads(vec_connected_components(vector_path=\"admin.geojson\"))", "json": "{\n  \"name\": \"vec.connected_components\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\"\n  }\n}"}, {"i": 86, "name": "vec.convex_hull", "module": "analysis", "domain": "vector", "relevance": "★★", "transfer": "A", "desc_cn": "灾害影响范围包络", "desc_raw": "Compute the convex hull of a set of polygons or points in a GeoJSON file. Useful for estimating the spatial envelope of a damage cluster or hazard spread footprint.", "plain": "把一堆点或面用最小的凸多边形包起来，快速得到「大致影响范围」。", "dep": "geo", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to convex hull GeoJSON"}, {"name": "area_m2", "type": "float", "desc": "Area of the hull (if CRS is projected)"}, {"name": "vertex_count", "type": "int", "desc": "Number of vertices in the hull"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path out_path", "py": "from dora.tools.analysis import vec_convex_hull\nimport json\nres = json.loads(vec_convex_hull(vector_path=\"admin.geojson\"))", "json": "{\n  \"name\": \"vec.convex_hull\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\"\n  }\n}"}, {"i": 87, "name": "vec.dissolve", "module": "analysis", "domain": "vector", "relevance": "★★★", "transfer": "A", "desc_cn": "把破碎淹没斑块合成连片淹没区", "desc_raw": "Dissolve (merge) overlapping or adjacent polygons into larger ones, optionally grouping by an attribute field. Useful for con 回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "center_lat", "type": "float", "required": true, "default": null, "desc": "Center point latitude (WGS84)"}, {"name": "center_lon", "type": "float", "required": true, "default": null, "desc": "Center point longitude (WGS84)"}, {"name": "max_distance_m", "type": "float", "required": true, "default": null, "desc": "最大搜索距离（米）"}], "returns": [{"name": "vector_path", "type": "str", "desc": "Path to filtered vector"}, {"name": "total_input", "type": "int", "desc": "Number of input features"}, {"name": "total_filtered", "type": "int", "desc": "Number of features within distance"}, {"name": "nearest_distance_m", "type": "float", "desc": "Distance to nearest feature"}, {"name": "farthest_distance_m", "type": "float", "desc": "Distance to farthest feature"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path center_lat center_lon max_distance_m", "py": "from dora.tools.analysis import vec_filter_by_distance_tool\nimport json\nres = json.loads(vec_filter_by_distance_tool(vector_path=\"admin.geojson\", center_lat=\"0.0\", center_lon=\"0.0\", max_distance_m=\"0.0\"))", "json": "{\n  \"name\": \"vec.filter_by_distance\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\",\n    \"center_lat\": \"0.0\",\n    \"center_lon\": \"0.0\",\n    \"max_distance_m\": \"0.0\"\n  }\n}"}, {"i": 91, "name": "vec.graph_shortest_path", "module": "analysis", "domain": "vector", "relevance": "★★", "transfer": "A", "desc_cn": "抢险/撤离路径规划", "desc_raw": "Find shortest path on an intact-road graph.", "plain": "在路网上找最短或最快的一条路。抢险车怎么开、群众往哪撤，靠它规划。", "dep": "networkx", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "graph_path", "type": "str", "required": true, "default": null, "desc": "路网图文件路径"}, {"name": "start", "type": "list[int]", "required": true, "default": null, "desc": "[row, col] start point (pixel coordin oat", "required": false, "default": "None", "desc": "像元边长（米）。掩膜无地理参考时必须显式给出"}], "returns": [{"name": "intersection_count", "type": "int", "desc": "Number of intersection pieces (one per pair of intersecting features)"}, {"name": "intersecting_a_count", "type": "int", "desc": "Number of features of the first dataset that intersect the second"}, {"name": "intersecting_b_count", "type": "int", "desc": "Number of features of the second dataset that intersect the first"}, {"name": "intersection_area_m2", "type": "float", "desc": "Total intersection area in square meters"}, {"name": "intersection_path", "type": "str", "desc": "Path to intersection GeoJSON"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_a_path vector_b_path pixel_size_m", "py": "from dora.tools.analysis import vec_intersect\nimport json\nres = json.loads(vec_intersect(vector_a_path=\"admin.geojson\", vector_b_path=\"admin.geojson\"))", "json": "{\n  \"name\": \"vec.intersect\",\n  \"arguments\": {\n    \"vector_a_path\": \"admin.geojson\",\n    \"vector_b_path\": \"admin.geojson\"\n  }\n}"}, {"i": 93, "name": "vec.kbuffer", "module": "analysis", "domain": "vector", "relevance": "★★", "transfer": "A", "desc_cn": "分级影响区（100/500/1000 m）", "desc_raw": "Create multiple buffers for given distances around geometries in a vector file. The distances are interpreted in CRS units (meters if CRS is metric).", "plain": "一次生成多层缓冲带，比如 100 / 500 / 1000 米三圈，用来分轻重影响区。", "dep": "geo", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "meters", "type": "list[float]", "required": true, "default": null, "desc": "Distances for buffering"}], "returns": [{"name": "buffers", "type": "list", "desc": "List of {distance, buffer_path}"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path meters", "py": "from dora.tools.analysis import vec_kbuffer\nimport json ★★", "transfer": "A", "desc_cn": "流域内平均降水、行政区平均 LST、耕地平均 NDVI", "desc_raw": "Sample raster values under vector geometries and compute summary statistics. Supports point, line, and polygon geometries. For points, the raster value at the point pixel is used. For non-point geometries, the raster is sampled over covered pixels.", "plain": "按行政边界、流域或任意多边形，把图里的数值汇总成一个数。「这个县平均降雨多少」「这个灌区受旱面积多大」都是它算的。", "dep": "geo+rasterio", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "raster_path", "type": "str", "required": true, "default": null, "desc": "栅格路径"}, {"name": "stats", "type": "list[str]", "required": false, "default": "None", "desc": "统计数据字典"}, {"name": "band", "type": "int", "required": false, "default": "1", "desc": "波段号，从 1 开始"}, {"name": "return_features", "type": "bool", "required": false, "default": "True", "desc": "Whether to include per-feature statistics. Default is true"}, {"name": "min_pixels", "type": "int", "required": false, "default": "1", "desc": "Minimum covered pixels required to keep a feature. Default is 1"}, {"name": "all_touched", "type": "bool", "required": false, "default": "False", "desc": "Whether to rasterize vectors with all_touched=True. Default is false"}], "returns": [{"name": "feature_count", "type": "int", "desc": "Number of features retained after min_pixels filtering"}, {"name": "feature_stats", "type": "list[dict], optional", "desc": "Per-feature statistics"}, {"name": "output_vector_path", "type": "str", "desc": "GeoJSON with attached statistics for retained features"}], "boundary": "", "pitfall": "", "tip": "唯一支持 `return_features=True` 逐要素返回的统计工具，可直接出表。「XX 县平均降雨」这类问法靠它一件支撑。", "keywords": "vector_path raster_path stats band return_features min_pixels all_touched", "py": "from dora.tools.analysis import vec_raster_stats\nimport json\nres = json.loads(vec_raster_stats(vector_path=\"admin.geojson\", raster_path=\"input.tif\"))", "json": "{\n  \"name\": \"vec.raster_stats\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\",\n    \"raster_path\": \"input.tif\"\n  }\n}"}, {"i": 101, "name": "vec.repair_min_edges", "module": "analysis", "domain": "vector", "relevance": "★★", "transfer": "A", "desc_cn": "断路情况下最小抢通方案", "desc_raw": "Given a road graph with some edges marked as damaged/blocked, find the minimum set of edges that must be repaired so that a shortest path between source and target nodes becomes possible. The solution minimises the number of repairs first and breaks ties by total path length. The graph may be provid", "plain": "算「最少修哪几段路，就能让所有孤立的点重新连上」，用于断路后的抢通排序。", "dep": "networkx", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "graph_path", "type": "str", "required": true, "default": null, "desc": "路网图文件路径"}, {"name": "source", "type": "str | int?", "required": false, "default": "None", "desc": "Source node id (e.g., a rescue base). If omitted"}, {"name": "target", "type": "str | int?", "required": false, "default": "None", "desc": "Target node id (e.g., a hospital). Same rule."}, {"name": "blocked_attr", "type": "str", "required": false, "default": "'damaged'", "desc": "Edge attribute marking a damaged/blocked edge."}], "returns": [{"name": "repair_edges", "type": "list", "desc": "Edge endpoints that must be repaired, e.g. [[u, v], ...]"}, {"name": "repair_count", "type": "int", "desc": "Minimum number of repairs needed on the optimal path"}, {"name": "path_length_m", "type": "float", "desc": "Total length of the post-repair path (metres)"}, {"name": "source", "type": "int", "desc": "Source node id actually used"}, {"name": "target", "type": "int", "desc": "Target node id actually used"}, {"name": "auto_selected", "type": "bool", "desc": "Whether source/target were auto-selected"}], "boundary": "", "pitfall": "", "tip": "「最少抢通哪几段」——溃堤、断路场景下比最短路更贴近指挥决策。", "keywords": "graph_path source target blocked_attr", "py": "from dora.tools.analysis import vec_repair_min_edges\nimport json\nres = json.loads(vec_repair_min_edges(graph_path=\"input.tif\"))", "json": "{\n  \"name\": \"vec.repair_min_edges\",\n  \"arguments\": {\n    \"graph_path\": \"input.tif\"\n  }\n}"}, {"i": 102, "name": "vec.road_centerline_extraction", "module": "analysis", "domain": "vector", "relevance": "★★", "transfer": "A", "desc_cn": "路网骨架，用于通行分析", "desc_raw": "Extract road centerlines directly from a road mask by skeletonizing and outputting centerlines as GeoJSON LineStrings. The caller must supply the class-id lists corresponding to intact vs damaged road pixels (look them up in the upstream segmentation tool's returned `classes` dict).", "plain": "从道路范围图里抽出一条条中心线，把「一片路面」变成「可以走的线」。", "dep": "skimage+geo", "guard_text": "有 `_tool_guard`：输入文件缺失时返回空结果，其他异常转成 `{\"error\": ...}` 返回", "params": [{"name": "mask_path", "type": "str", "required": true, "default": null, "desc": "掩膜路径（二值或多类）"}, {"name": "intact_classes", "type": "list[int]", "required": false, "default": "None", "desc": "Class ids treated as intact road"}, {"name": "damaged_classes", "type": "list[int]", "required": false, "default": "None", "desc": "Class ids treated as damaged road"}], "returns": [{"name": "centerline_path", "type": "str", "desc": "Path to centerline GeoJSON"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "mask_path intact_classes damaged_classes", "py": "from dora.tools.analysis import road_centerline_extraction\nimport json\nres = json.loads(road_centerline_extraction(mask_path=\"mask.png\"))", "json": "{\n  \"name\": \"vec.road_centerline_extraction\",\n  \"arguments\": {\n    \"mask_path\": \"mask.png\"\n  }\n}"}, {"i": 103, "name": "vec.simplify", "module": "analysis", "domain": "vector", "relevance": "★★", "transfer": "A", "desc_cn": "矢量过大时压缩，便于发布", "desc_raw": "Simplify polygon or line geometries using the Douglas-Peucker algorithm. Reduces the number of vertices while preserving overall shape, producing lighter outputs suitable for visualization or downstream computation.", "plain": "在形状不失真的前提下减少顶点数，让数据变小、加载更快。", "dep": "geo", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "vector_path", "type": "str", "required": true, "default": null, "desc": "矢量路径（GeoJSON）"}, {"name": "tolerance", "type": "float", "required": true, "default": null, "desc": "Simplification tolerance in CRS units (meters for projected)"}, {"name": "preserve_topology", "type": "bool", "required": false, "default": "True", "desc": "Default True"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to simplified GeoJSON"}, {"name": "input_vertex_count", "type": "int", "desc": "Total vertices in input"}, {"name": "output_vertex_count", "type": "int", "desc": "Total vertices in output"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "vector_path tolerance preserve_topology out_path", "py": "from dora.tools.analysis import vec_simplify\nimport json\nres = json.loads(vec_simplify(vector_path=\"admin.geojson\", tolerance=\"0.0\"))", "json": "{\n  \"name\": \"vec.simplify\",\n  \"arguments\": {\n    \"vector_path\": \"admin.geojson\",\n    \"tolerance\": \"0.0\"\n  }\n}"}, {"i": 104, "name": "vec.voronoi", "module": "analysis", "domain": "vector", "relevance": "★", "transfer": "A", "desc_cn": "物资投放点/水文站服务范围", "desc_raw": "Compute a Voronoi diagram (service-area partition) from a set of input points. Each resulting polygon contains all locations closer to its seed point than to any other. Useful for assigning hospital/firestation service areas.", "plain": "", "dep": "geo", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "points_path", "type": "str", "required": true, "default": null, "desc": "点要素文件（GeoJSON）"}, {"name": "boundary_path", "type": "str?", "required": false, "default": "None", "desc": "Optional boundary polygon to clip the diagram"}, {"name": "out_path", "type": "str?", "required": false, "default": "None", "desc": "输出文件路径"}], "returns": [{"name": "output_path", "type": "str", "desc": "Path to Voronoi polygons GeoJSON"}, {"name": "cell_count", "type": "int", "desc": "Number of Voronoi cells generated"}], "boundary": "", "pitfall": "", "tip": "", "keywords": "points_path boundary_path out_path", "py": "from dora.tools.analysis import vec_voronoi\nimport json\nres = json.loads(vec_voronoi(points_path=\"input.tif\"))", "json": "{\n  \"name\": \"vec.voronoi\",\n  \"arguments\": {\n    \"points_path\": \"input.tif\"\n  }\n}"}, {"i": 105, "name": "seg.flood", "module": "perception", "domain": "water", "relevance": "★★★", "transfer": "C（跨分辨率失效）", "desc_cn": "洪水淹没范围主入口；两次水体推理再相减", "desc_raw": "Segment flood areas from pre/post disaster optical satellite images. Detects standing water and flooded regions. Spatial resolution: 0.5m-1.0m.", "plain": "给它灾前、灾后两张光学影像，它先分别认出两期的水面，再相减，得到「新淹了哪里」。注意它给的是范围，不含水深。", "dep": "模型 DPT（water）×2", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "pre_image_path", "type": "str", "required": true, "default": null, "desc": "灾前影像路径"}, {"name": "post_image_path", "type": "str", "required": true, "default": null, "desc": "灾后影像路径"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to binary flooding mask (255 = flooding)"}], "boundary": "需要**灾前 + 灾后同一区域的两期影像**；只给单期时无法调用。水体权重在 10 m 输入上 IoU 0.107、83 景中 54 景零检出（训练于 0.5–1 m）。", "pitfall": "内部两次 `_water_mask` 调用**不传参考栅格**，所以输出掩膜是 PNG、没有地理参考——下游算面积必须手动给 `pixel_size_m`。", "tip": "灾前若处于枯水期，河滩与水库消落带会被判成「新增淹没」；反过来用（丰水期→枯水期）可算退水面积，那是旱情指标。", "keywords": "pre_image_path post_image_path", "py": "from dora.tools.perception import seg_flood\nimport json\nres = json.loads(seg_flood(pre_image_path=\"pre.tif\", post_image_path=\"post.tif\"))", "json": "{\n  \"name\": \"seg.flood\",\n  \"arguments\": {\n    \"pre_image_path\": \"pre.tif\",\n    \"post_image_path\": \"post.tif\"\n  }\n}"}, {"i": 106, "name": "seg.reservoir", "module": "perception", "domain": "water", "relevance": "★★★", "transfer": "C（14 波段归一化）", "desc_cn": "干旱核心：水域面积萎缩监测；需 14 波段输入", "desc_raw": "Segment reservoirs from multi-modal data: multi-spectral optical + DEM + slope. Spatial resolution: 10m. IMPORTANT: The input image MUST have exactly 14 bands (12-band multi-spectral + DEM: 1 band + Slope: 1 band). If your data has separate multi-spectral, DEM, and slope files, use ras.concat to mer", "plain": "从多光谱影像里认出水库、湖泊的水面轮廓，用来比较不同时期的水域面积，看是否萎缩。", "dep": "模型 WeTr 14ch", "guard_text": "函数内 `try/except`：异常转成 `{\"error\": ...}` 返回", "params": [{"name": "post_image_path", "type": "str", "required": true, "default": null, "desc": "灾后影像路径"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to the saved binary reservoir mask"}, {"name": "classes", "type": "dict", "desc": "Mapping of class values to semantic labels"}], "boundary": "必须 **14 波段且顺序固定**（B1–B12 + 坡度 + DEM），并带 Landslide4Sense 的归一化常量；换 GF 系列需重标定或重训。", "pitfall": "波段对调**不报错**：DEM 与坡度互换后，同一景面积从 0.815 km² 变成 1.476 km²。", "tip": "", "keywords": "post_image_path", "py": "from dora.tools.perception import seg_reservoir\nimport json\nres = json.loads(seg_reservoir(post_image_path=\"post.tif\"))", "json": "{\n  \"name\": \"seg.reservoir\",\n  \"arguments\": {\n    \"post_image_path\": \"post.tif\"\n  }\n}"}, {"i": 107, "name": "seg.water_aerial", "module": "perception", "domain": "water", "relevance": "★★★", "transfer": "C（0.03 m 航拍）", "desc_cn": "应急航拍精细淹没边界", "desc_raw": "Segment water areas from post-disaster optical airborne image. Spatial resolution: 0.03m.", "plain": "在无人机航拍图上精细勾出水体边界。范围小，但边界比卫星清楚得多。", "dep": "模型 DPT-aerial", "guard_text": "**无统一包装**：异常会直接抛出（MCP 层表现为 tool error）", "params": [{"name": "post_image_path", "type": "str", "required": true, "default": null, "desc": "灾后影像路径"}], "returns": [{"name": "mask_path", "type": "str", "desc": "Path to water mask (255 = water)"}, {"name": "classes", "type": "dict", "desc": "{11: \"water\"}"}], "boundary": "0.03 m 航拍专用，星载影像上目标尺度不符。有航次时它是最精细的边界来源。", "pitfall": "", "tip": "", "keywords": "post_image_path", "py": "from dora.tools.perception import seg_water_aerial\nimport json\nres = json.loads(seg_water_aerial(post_image_path=\"post.tif\"))", "json": "{\n  \"name\": \"seg.water_aerial\",\n  \"arguments\": {\n    \"post_image_path\": \"post.tif\"\n  }\n}"}];
const DOMAINS = {"water": "10-水体与淹没", "asset": "20-承灾体", "terrain": "30-地形与地表变化", "raster": "40-栅格分析", "vector": "50-矢量与空间关系", "compute": "60-计算与决策", "carto": "70-制图与报告", "poi": "80-POI-点位", "other": "90-其他感知"};
let cur = -1;
const q = document.getElementById('q'), dom = document.getElementById('dom');
const list = document.getElementById('list'), detail = document.getElementById('detail');

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function show(rows) {
  list.innerHTML = rows.map(t => `<div class="item" data-i="${t.i}">
      <div class="nm">${esc(t.name)}</div>
      <div class="meta">${esc(DOMAINS[t.domain])} · ${t.relevance} · ${t.transfer}</div>
      <div class="meta">${esc(t.desc_cn)}</div></div>`).join('') || '<div class="empty">没有匹配的工具。</div>';
  document.getElementById('stat').textContent = rows.length + ' / ' + DATA.length + ' 件';
  list.querySelectorAll('.item').forEach(el => el.onclick = () => pick(+el.dataset.i));
}
function pick(i) {
  cur = i;
  list.querySelectorAll('.item').forEach(el => el.classList.toggle('on', +el.dataset.i === i));
  const t = DATA.find(x => x.i === i);
  let h = `<h2>${esc(t.name)}</h2>
    <div><span class="tag">${esc(DOMAINS[t.domain])}</span><span class="tag">相关性 ${t.relevance}</span>
    <span class="tag">可迁移 ${t.transfer}</span><span class="tag">${esc(t.module)}</span></div>
    <p>${esc(t.desc_cn)}</p>`;
  if (t.plain) h += `<h3>这个工具做什么</h3><p>${esc(t.plain)}</p>`;
  if (t.desc_raw) h += `<h3>源码原话</h3><p>${esc(t.desc_raw)}</p>`;
  if (t.params.length) {
    h += `<h3>输入</h3><table><tr><th>参数</th><th>类型</th><th>必填</th><th>默认</th><th>说明</th></tr>`
      + t.params.map(p => `<tr><td><code>${esc(p.name)}</code></td><td>${esc(p.type||'—')}</td>
        <td>${p.required?'是':'否'}</td><td>${p.default?('<code>'+esc(p.default)+'</code>'):'—'}</td>
        <td>${esc(p.desc||'—')}</td></tr>`).join('') + `</table>`;
  }
  if (t.returns.length) {
    h += `<h3>输出</h3><table><tr><th>字段</th><th>类型</th><th>说明</th></tr>`
      + t.returns.map(r => `<tr><td><code>${esc(r.name)}</code></td><td>${esc(r.type||'—')}</td>
        <td>${esc(r.desc||'—')}</td></tr>`).join('') + `</table>`;
  }
  h += `<h3>依赖与运行</h3><p>依赖：${esc(t.dep)}<br>异常：${esc(t.guard_text)}</p>`;
  h += `<h3>调用</h3><pre><code>${esc(t.py)}</code></pre><pre><code>${esc(t.json)}</code></pre>`;
  h += `<h3>适用边界</h3><p>${esc(t.boundary || '未做专项实测，按代码契约推定。')}</p>`;
  if (t.pitfall) h += `<p><b>坑：</b>${esc(t.pitfall)}</p>`;
  if (t.tip) h += `<p><b>建议：</b>${esc(t.tip)}</p>`;
  detail.innerHTML = h;
}
function filter() {
  const kw = q.value.trim().toLowerCase(), d = dom.value;
  const rows = DATA.filter(t => (!d || t.domain === d) &&
    (!kw || (t.name + ' ' + t.desc_cn + ' ' + t.keywords).toLowerCase().includes(kw)));
  show(rows);
}
q.oninput = filter; dom.onchange = filter; filter();
</script>
